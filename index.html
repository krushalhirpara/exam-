        subtitle: "Reserve Bank of India Act, 1934 | Monetary Authority & Banking Regulator",
        content: `1. Introduction
English

The Reserve Bank of India (RBI) is the central bank of India. It was established under the Reserve Bank of India Act, 1934 and commenced operations on 1 April 1935. The RBI was nationalised on 1 January 1949.

The RBI occupies a central position in India's monetary and banking system. It regulates the monetary system, supervises banks and certain financial institutions, manages currency, acts as banker to the Government, and maintains financial stability.

ગુજરાતી

રિઝર્વ બેંક ઓફ ઈન્ડિયા (RBI) ભારતની કેન્દ્રીય બેંક છે. તેની સ્થાપના Reserve Bank of India Act, 1934 હેઠળ કરવામાં આવી હતી અને તેણે 1 એપ્રિલ 1935થી કામગીરી શરૂ કરી હતી. RBIનું 1 જાન્યુઆરી 1949ના રોજ રાષ્ટ્રીયકરણ કરવામાં આવ્યું હતું.

RBI ભારતની નાણાકીય અને બેંકિંગ વ્યવસ્થામાં મહત્વપૂર્ણ સ્થાન ધરાવે છે. તે નાણાકીય વ્યવસ્થાનું નિયમન કરે છે, બેંકો અને કેટલીક નાણાકીય સંસ્થાઓની દેખરેખ રાખે છે, ચલણી નોટોનું સંચાલન કરે છે, સરકારની બેંક તરીકે કાર્ય કરે છે અને નાણાકીય સ્થિરતા જાળવવામાં મદદ કરે છે.

2. Objectives of RBI
English

The major objectives of the RBI are:

To maintain monetary stability.
To regulate the supply of money and credit.
To maintain price stability while keeping economic growth in mind.
To regulate and supervise the banking system.
To maintain public confidence in the banking system.
To manage foreign exchange and external payments.
To act as banker and debt manager to the Government.
To promote a sound and efficient financial system.

ગુજરાતી

RBIના મુખ્ય હેતુઓ:

નાણાકીય સ્થિરતા જાળવવી.
નાણાં અને ધિરાણના પુરવઠાનું નિયમન કરવું.
આર્થિક વિકાસને ધ્યાનમાં રાખીને ભાવ સ્થિરતા જાળવવી.
બેંકિંગ વ્યવસ્થાનું નિયમન અને દેખરેખ રાખવી.
બેંકિંગ વ્યવસ્થામાં લોકોનો વિશ્વાસ જાળવવો.
વિદેશી વિનિમય અને આંતરરાષ્ટ્રીય ચુકવણીનું સંચાલન કરવું.
સરકારની બેંક અને સરકારના દેવાના મેનેજર તરીકે કાર્ય કરવું.
મજબૂત અને કાર્યક્ષમ નાણાકીય વ્યવસ્થાને પ્રોત્સાહન આપવું.

3. Functions of RBI

RBIના કાર્યોને મુખ્યત્વે નીચે પ્રમાણે સમજાવી શકાય:

A. Issue of Currency
English

One of the important functions of RBI is the issue and management of currency.

Under the RBI Act, 1934, RBI has the sole right to issue banknotes in India, except for the ₹1 note, which is issued by the Government of India.

RBI also manages the circulation of currency notes and ensures that adequate currency is available in the economy.

ગુજરાતી

RBIનું એક મહત્વપૂર્ણ કાર્ય ચલણી નોટો બહાર પાડવાનું અને તેનું સંચાલન કરવાનું છે.

RBI Act, 1934 હેઠળ ₹1ની નોટ સિવાયની બેંક નોટો બહાર પાડવાનો અધિકાર RBI પાસે છે. ₹1ની નોટ ભારત સરકાર દ્વારા બહાર પાડવામાં આવે છે.

RBI અર્થતંત્રમાં પૂરતી ચલણી નોટો ઉપલબ્ધ રહે અને ચલણનું યોગ્ય સંચાલન થાય તેની ખાતરી કરે છે.

યાદ રાખો:
RBI → Banknotes
Government of India → ₹1 Note

B. Banker to the Government
English

RBI acts as the banker, agent and financial adviser to the Central Government and, under agreements, to State Governments.

It maintains government accounts, receives government money, makes government payments and manages government borrowing.

RBI also manages the public debt of the Government.

ગુજરાતી

RBI કેન્દ્ર સરકારની બેંક, એજન્ટ અને નાણાકીય સલાહકાર તરીકે કાર્ય કરે છે. કરારો અનુસાર તે રાજ્ય સરકારો માટે પણ આવી ભૂમિકા ભજવે છે.

તે સરકારના ખાતાઓનું સંચાલન કરે છે, સરકારની આવક સ્વીકારે છે, સરકાર તરફથી ચુકવણીઓ કરે છે અને સરકારના ઉધારનું સંચાલન કરે છે.

RBI સરકારના Public Debtનું પણ સંચાલન કરે છે.

C. Banker's Bank
English

RBI is known as the banker's bank because commercial banks maintain certain reserves with RBI and RBI provides support to banks when required.

RBI can provide financial assistance to eligible banks and acts as the lender of last resort.

This means that when a bank is facing serious liquidity problems and cannot obtain funds from other sources, RBI can provide assistance subject to applicable conditions.

ગુજરાતી

RBIને બેંકોની બેંક કહેવામાં આવે છે કારણ કે કોમર્શિયલ બેંકો RBI પાસે નિર્ધારિત અનામતો રાખે છે અને જરૂરિયાતના સમયે RBI બેંકોને સહાય પૂરી પાડે છે.

RBI પાત્ર બેંકોને નાણાકીય સહાય આપી શકે છે અને Lender of Last Resort તરીકે કાર્ય કરે છે.

તેનો અર્થ એ છે કે જ્યારે કોઈ બેંકને ગંભીર નાણાકીય પ્રવાહિતા (Liquidity)ની સમસ્યા થાય અને તેને અન્ય સ્ત્રોતોમાંથી નાણાં ન મળે, ત્યારે લાગુ નિયમો અને શરતોને આધિન RBI મદદ કરી શકે છે.

D. Controller of Credit and Monetary Policy
English

RBI controls the availability and cost of money and credit in the economy through monetary policy.

It uses various monetary policy instruments, such as:

Repo Rate
Reverse Repo Rate
Cash Reserve Ratio (CRR)
Statutory Liquidity Ratio (SLR)
Open Market Operations (OMOs)
Bank Rate
Other liquidity management measures

These instruments influence the amount of liquidity and credit available in the financial system.

ગુજરાતી

RBI નાણાં અને ધિરાણની ઉપલબ્ધતા તથા તેની કિંમતનું નિયંત્રણ નાણાકીય નીતિ (Monetary Policy) દ્વારા કરે છે.

તે વિવિધ સાધનોનો ઉપયોગ કરે છે, જેમ કે:

Repo Rate
Reverse Repo Rate
Cash Reserve Ratio (CRR)
Statutory Liquidity Ratio (SLR)
Open Market Operations (OMO)
Bank Rate
અન્ય Liquidity Management સાધનો

આ સાધનો દ્વારા નાણાકીય વ્યવસ્થામાં ઉપલબ્ધ નાણાં અને ધિરાણની માત્રા પર અસર થાય છે.

E. Regulation and Supervision of Banks
English

RBI regulates and supervises banks to ensure that they operate in a safe and sound manner.

Its regulatory and supervisory functions include:

Granting banking licences under applicable laws.
Inspection and supervision of banks.
Issuing regulatory directions.
Monitoring the financial condition of banks.
Taking regulatory action when necessary.
Promoting sound banking practices.

The Banking Regulation Act, 1949 provides an important legal framework for RBI's regulation of banking companies.

ગુજરાતી

RBI બેંકોનું નિયમન અને દેખરેખ કરે છે જેથી બેંકો સુરક્ષિત અને યોગ્ય રીતે કાર્ય કરે.

તેના મુખ્ય કાર્યો:

લાગુ કાયદા હેઠળ બેંકિંગ લાઇસન્સ આપવું.
બેંકોનું Inspection અને Supervision કરવું.
નિયમનકારી નિર્દેશો બહાર પાડવા.
બેંકોની નાણાકીય સ્થિતિનું નિરીક્ષણ કરવું.
જરૂરી હોય ત્યારે Regulatory Action લેવું.
યોગ્ય અને મજબૂત Banking Practicesને પ્રોત્સાહન આપવું.

Banking Regulation Act, 1949 બેંકિંગ કંપનીઓના RBI દ્વારા નિયમન માટે મહત્વપૂર્ણ કાનૂની માળખું પૂરું પાડે છે.

F. Foreign Exchange Management
English

RBI plays an important role in the management of foreign exchange under the Foreign Exchange Management Act, 1999 (FEMA).

Its objectives include facilitating external trade and payments and promoting the orderly development and maintenance of the foreign exchange market in India.

RBI also regulates authorised persons dealing in foreign exchange under FEMA.

ગુજરાતી

RBI Foreign Exchange Management Act, 1999 (FEMA) હેઠળ વિદેશી વિનિમય વ્યવસ્થાપનમાં મહત્વપૂર્ણ ભૂમિકા ભજવે છે.

તેના હેતુઓમાં આંતરરાષ્ટ્રીય વેપાર અને ચુકવણીને સરળ બનાવવી તથા ભારતમાં Foreign Exchange Marketના વ્યવસ્થિત વિકાસ અને જાળવણીને પ્રોત્સાહન આપવાનો સમાવેશ થાય છે.

RBI FEMA હેઠળ Foreign Exchange સાથે વ્યવહાર કરતા Authorized Personsનું પણ નિયમન કરે છે.

G. Custodian of Foreign Exchange Reserves
English

RBI acts as the custodian and manager of India's foreign exchange reserves.

Foreign exchange reserves help India meet external payment obligations and provide confidence in the country's external financial position.

RBI manages these reserves in accordance with the applicable legal and policy framework.

ગુજરાતી

RBI ભારતના **વિદેશી હૂંડિયામણના અનામતો (Foreign Exchange Reserves)**નું સંરક્ષણ અને સંચાલન કરે છે.

Foreign Exchange Reserves ભારતને આંતરરાષ્ટ્રીય ચુકવણીની જરૂરિયાતો પૂરી કરવામાં મદદ કરે છે અને દેશની બાહ્ય નાણાકીય સ્થિતિમાં વિશ્વાસ જાળવવામાં મદદ કરે છે.

RBI લાગુ કાયદા અને નીતિના માળખા અનુસાર આ અનામતોનું સંચાલન કરે છે.

H. Developmental Functions
English

RBI also performs various developmental functions for the development of the financial system.

These include:

Promoting financial inclusion.
Supporting development of banking infrastructure.
Encouraging digital payments.
Promoting financial literacy.
Supporting efficient payment and settlement systems.
Facilitating access to formal financial services.

ગુજરાતી

RBI નાણાકીય વ્યવસ્થાના વિકાસ માટે વિવિધ Developmental Functions પણ કરે છે.

તેમાં:

Financial Inclusionને પ્રોત્સાહન આપવું.
બેંકિંગ ઇન્ફ્રાસ્ટ્રક્ચરનો વિકાસ કરવો.
Digital Paymentsને પ્રોત્સાહન આપવું.
Financial Literacy વધારવી.
Payment અને Settlement Systemsને કાર્યક્ષમ બનાવવું.
લોકોને Formal Financial Services સુધી પહોંચવામાં મદદ કરવી.

I. Regulation of Payment and Settlement Systems
English

RBI regulates and oversees payment and settlement systems in India.

A safe and efficient payment system is essential for the functioning of the financial system.

RBI's role covers areas such as electronic payments and other payment systems under the applicable legal framework.

ગુજરાતી

RBI ભારતમાં Payment અને Settlement Systemsનું નિયમન અને દેખરેખ કરે છે.

સુરક્ષિત અને કાર્યક્ષમ Payment System નાણાકીય વ્યવસ્થાના યોગ્ય સંચાલન માટે જરૂરી છે.

RBI લાગુ કાયદા હેઠળ Electronic Payments અને અન્ય Payment Systems અંગે મહત્વપૂર્ણ નિયમનકારી ભૂમિકા ભજવે છે.

J. Consumer Protection
English

RBI takes measures to protect the interests of bank customers and users of regulated financial services.

It issues directions relating to customer service, grievance redressal and fair practices.

RBI also provides mechanisms through which customers can raise complaints against regulated entities, including the Integrated Ombudsman Scheme.

ગુજરાતી

RBI બેંકના ગ્રાહકો અને નિયમન હેઠળની નાણાકીય સેવાઓના વપરાશકર્તાઓના હિતોનું રક્ષણ કરવા માટે પગલાં લે છે.

તે Customer Service, Grievance Redressal અને Fair Practices સંબંધિત નિયમો અને નિર્દેશો બહાર પાડે છે.

RBI દ્વારા Integrated Ombudsman Scheme જેવી વ્યવસ્થા દ્વારા ગ્રાહકોને નિયમન હેઠળની સંસ્થાઓ સામે ફરિયાદ કરવાની સુવિધા મળે છે.

K. Financial Stability
English

RBI contributes to maintaining the stability of the financial system.

It monitors risks in the banking and financial sectors and uses regulatory, supervisory and monetary tools to address risks within its mandate.

Financial stability is important because disruption in the banking system can affect businesses, consumers and the wider economy.

ગુજરાતી

RBI નાણાકીય વ્યવસ્થાની Financial Stability જાળવવામાં મહત્વપૂર્ણ ભૂમિકા ભજવે છે.

તે Banking અને Financial Sectorમાં રહેલા જોખમોનું નિરીક્ષણ કરે છે અને પોતાની સત્તાની મર્યાદામાં Regulatory, Supervisory અને Monetary Toolsનો ઉપયોગ કરે છે.

નાણાકીય સ્થિરતા મહત્વપૂર્ણ છે કારણ કે બેંકિંગ વ્યવસ્થામાં ગંભીર સમસ્યા થાય તો તેની અસર વ્યવસાય, ગ્રાહકો અને સમગ્ર અર્થતંત્ર પર થઈ શકે છે.

4. Powers of RBI

હવે Functions પછી RBIની મુખ્ય Powers સમજવી મહત્વપૂર્ણ છે.

1. Power to Issue Currency
English

RBI has the statutory authority to issue banknotes, subject to the RBI Act, 1934, while the ₹1 note is issued by the Government.

ગુજરાતી

RBI Act, 1934 હેઠળ RBIને બેંક નોટો બહાર પાડવાની વૈધાનિક સત્તા છે, જ્યારે ₹1ની નોટ ભારત સરકાર બહાર પાડે છે.

2. Power to Regulate Banks
English

RBI has extensive regulatory powers over banks under the Banking Regulation Act, 1949 and other applicable laws.

It can issue directions, conduct inspections and take regulatory measures within its statutory powers.

ગુજરાતી

Banking Regulation Act, 1949 અને અન્ય લાગુ કાયદા હેઠળ RBIને બેંકોના નિયમન માટે વ્યાપક સત્તાઓ આપવામાં આવી છે.

RBI નિયમો અને નિર્દેશો બહાર પાડી શકે છે, Inspection કરી શકે છે અને કાયદા મુજબ Regulatory Measures લઈ શકે છે.

3. Power of Inspection
English

RBI has the power to inspect banks and certain regulated entities to assess their financial condition, management, compliance and operations.

ગુજરાતી

RBIને બેંકો અને કેટલીક નિયમન હેઠળની સંસ્થાઓનું Inspection કરવાની સત્તા છે જેથી તેમની નાણાકીય સ્થિતિ, મેનેજમેન્ટ, કાયદાનું પાલન અને કામગીરીની તપાસ કરી શકાય.

4. Power to Issue Directions
English

RBI can issue directions to regulated entities where authorised by law.

These directions may relate to banking operations, prudential requirements, customer protection, governance and other regulatory matters.

ગુજરાતી

કાયદા દ્વારા આપવામાં આવેલી સત્તા હેઠળ RBI નિયમન હેઠળની સંસ્થાઓને Directions આપી શકે છે.

આ નિર્દેશો Banking Operations, Prudential Requirements, Customer Protection અને Governance વગેરે બાબતો સાથે સંબંધિત હોઈ શકે છે.

5. Power to Control Credit
English

RBI can use monetary policy and other statutory or regulatory instruments to influence credit conditions and liquidity in the economy.

ગુજરાતી

RBI Monetary Policy અને અન્ય કાયદાકીય અથવા Regulatory Instruments દ્વારા અર્થતંત્રમાં Credit અને Liquidity Conditions પર અસર કરી શકે છે.

6. Power relating to Foreign Exchange
English

Under FEMA, RBI exercises powers relating to foreign exchange transactions and authorised persons dealing in foreign exchange.

ગુજરાતી

FEMA, 1999 હેઠળ RBIને Foreign Exchange Transactions તથા Foreign Exchange સાથે વ્યવહાર કરતા Authorized Persons સંબંધિત સત્તાઓ પ્રાપ્ત છે.

7. Power to Impose Regulatory Measures
English

Where permitted by law, RBI can take regulatory measures against regulated entities for violations or deficiencies.

Such measures may include directions, restrictions and other actions authorised under the relevant legislation.

ગુજરાતી

જ્યાં કાયદો સત્તા આપે છે ત્યાં નિયમોના ઉલ્લંઘન અથવા ગંભીર ખામીઓ સામે RBI Regulatory Measures લઈ શકે છે.

આમાં Directions, Restrictions અને સંબંધિત કાયદા હેઠળ અધિકૃત અન્ય કાર્યવાહીનો સમાવેશ થઈ શકે છે.

5. Importance of RBI
English

The importance of RBI can be summarised as follows:

Maintains monetary stability.
Regulates the banking sector.
Manages currency.
Acts as banker to the Government.
Supports banking liquidity.
Manages foreign exchange reserves.
Regulates payment systems.
Promotes financial inclusion.
Protects customers of regulated entities.
Contributes to financial stability.

ગુજરાતી

RBIનું મહત્વ:

નાણાકીય સ્થિરતા જાળવે છે.
બેંકિંગ ક્ષેત્રનું નિયમન કરે છે.
ચલણનું સંચાલન કરે છે.
સરકારની બેંક તરીકે કાર્ય કરે છે.
બેંકિંગ ક્ષેત્રમાં Liquidityને સહાય કરે છે.
Foreign Exchange Reservesનું સંચાલન કરે છે.
Payment Systemsનું નિયમન કરે છે.
Financial Inclusionને પ્રોત્સાહન આપે છે.
ગ્રાહકોના હિતોનું રક્ષણ કરવામાં મદદ કરે છે.
Financial Stabilityમાં યોગદાન આપે છે.

6. Conclusion
English

The Reserve Bank of India is the central institution of India's monetary and banking system. Its functions extend beyond issuing currency. It regulates banks, conducts monetary policy, manages foreign exchange reserves, acts as banker to the Government, oversees payment systems and contributes to financial stability and consumer protection.

Therefore, RBI plays a vital role in maintaining an orderly, stable and efficient financial system in India.

Section 8

Under Section 8, a banking company is generally prohibited from engaging directly or indirectly in the business of buying or selling goods, except in connection with the realisation or negotiation of certain bills or securities or as otherwise permitted by law.

The purpose is to ensure that banks primarily carry on banking business rather than ordinary commercial trading.

Section 8 મુજબ Banking Companyને સામાન્ય રીતે માલની ખરીદી અથવા વેચાણના વ્યવસાયમાં સીધી કે આડકતરી રીતે જોડાવા પર પ્રતિબંધ છે, સિવાય કે કાયદા હેઠળ માન્ય ચોક્કસ પરિસ્થિતિ હોય.

આ જોગવાઈનો હેતુ એ છે કે બેંકોનું મુખ્ય ધ્યાન Banking Business પર રહે અને સામાન્ય વેપારી પ્રવૃત્તિઓ પર નહીં.

6. Management of Banking Companies
Section 10
English

The Act contains provisions relating to the management of banking companies.

It places restrictions and requirements concerning the appointment and functioning of persons in management and aims to ensure that banking companies are managed by persons meeting the legal requirements.

ગુજરાતી

કાયદામાં Banking Companiesના Management સંબંધિત જોગવાઈઓ છે.

Managementમાં રહેલા વ્યક્તિઓની નિમણૂક અને કામગીરી અંગે કેટલીક કાનૂની આવશ્યકતાઓ અને નિયંત્રણો છે જેથી બેંકનું સંચાલન યોગ્ય રીતે થાય.

7. Capital and Reserves
Sections 11 and 17
English

The Act provides requirements concerning paid-up capital and reserves.

Section 11

It lays down requirements relating to the minimum paid-up capital and reserves of banking companies, subject to the statutory framework.

Section 17

It provides for the creation of a Reserve Fund. A banking company is required to transfer the prescribed portion of its profits to the reserve fund before declaring dividend, subject to the conditions provided by law.

ગુજરાતી

આ કાયદામાં Paid-up Capital અને Reserves અંગે જોગવાઈ કરવામાં આવી છે.

Section 11

Banking Company માટે Minimum Paid-up Capital અને Reserves અંગે કાયદાકીય જોગવાઈ કરવામાં આવી છે.

Section 17

Banking Company માટે Reserve Fund બનાવવાની જોગવાઈ છે. કાયદામાં જણાવેલી શરતો અનુસાર Dividend જાહેર કરતા પહેલાં નફાનો નિર્ધારિત ભાગ Reserve Fundમાં ટ્રાન્સફર કરવાનો હોય છે.

8. Restriction on Dividend
Section 15
English

The Act places statutory conditions on the declaration of dividends by banking companies.

A banking company cannot freely declare dividends without satisfying the requirements relating to capital and other statutory conditions.

ગુજરાતી

Section 15 Banking Company દ્વારા Dividend જાહેર કરવા અંગે કાયદાકીય શરતો નક્કી કરે છે.

Banking Company Capital અને અન્ય કાયદાકીય જરૂરીયાતો પૂર્ણ કર્યા વિના મનસ્વી રીતે Dividend જાહેર કરી શકતી નથી.

9. Licensing of Banking Companies
Section 22
English

One of the most important provisions is Section 22, which deals with licensing of banking companies.

A banking company cannot carry on banking business in India without obtaining a licence from the Reserve Bank of India.

While considering an application for a banking licence, RBI considers matters such as:

Financial position of the company.
Nature of its management.
Adequacy of capital structure.
Public interest.
Whether the affairs of the company are likely to be conducted in a manner that does not prejudice depositors.
Other statutory requirements.

ગુજરાતી

Section 22 ખૂબ જ મહત્વપૂર્ણ છે. તે Banking Companyના Licensing અંગે છે.

ભારતમાં Banking Business કરવા માટે Banking Companyએ RBI પાસેથી Licence મેળવવું જરૂરી છે.

RBI Licence આપતી વખતે કેટલીક બાબતો ધ્યાનમાં લે છે:

કંપનીની Financial Position.
Managementની યોગ્યતા.
Capital Structure પૂરતું છે કે નહીં.
Public Interest.
કંપનીનું સંચાલન Depositorsના હિતને નુકસાન પહોંચાડે તેવી શક્યતા છે કે નહીં.
અન્ય કાયદાકીય આવશ્યકતાઓ.

⭐ Exam Point

Section 22 = Licensing of Banking Companies
આ નંબર ખાસ યાદ રાખવો.

10. Opening of New Branches
Section 23
English

Under Section 23, a banking company requires RBI's approval for opening a new place of business or changing the location of an existing place of business, subject to the statutory framework.

This enables RBI to regulate the expansion and branch network of banks.

ગુજરાતી

Section 23 મુજબ Banking Companyએ નવી Branch અથવા Place of Business શરૂ કરવા અથવા કેટલીક પરિસ્થિતિમાં હાલની Branchનું સ્થાન બદલવા માટે RBIની મંજૂરી મેળવવી પડે છે.

આથી RBI બેંકોના Branch Expansionનું નિયમન કરી શકે છે.

⭐ Exam Point

Section 23 = Opening of New Branches

11. Restrictions on Loans and Advances
Sections 20 and 21
English

The Act places restrictions on certain loans and advances.

Section 20 restricts a banking company from entering into certain transactions relating to loans and advances to directors and specified connected interests.

Section 21 gives RBI power to control advances by banking companies. RBI may determine policy relating to advances and issue directions concerning matters such as:

Purpose of advances
Margins
Maximum amount
Interest rates
Other terms and conditions

ગુજરાતી

આ કાયદો કેટલાક Loans and Advances ઉપર નિયંત્રણ મૂકે છે.

Section 20 Directors અને સંબંધિત હિત ધરાવતા ચોક્કસ વ્યક્તિઓને Loans/Advances આપવા અંગે પ્રતિબંધો મૂકે છે.

Section 21 RBIને Banking Companies દ્વારા આપવામાં આવતા Advances ઉપર નિયંત્રણ રાખવાની સત્તા આપે છે.

RBI નીચેની બાબતો અંગે Directions આપી શકે છે:

Loanનો હેતુ
Margin
Maximum Amount
Interest Rate
અન્ય Terms and Conditions

12. Power of RBI to Control Advances
English

RBI may issue directions to banking companies in the public interest and to ensure proper banking practices.

This power is important for maintaining credit discipline and preventing excessive or risky lending.

ગુજરાતી

RBI Public Interest અને યોગ્ય Banking Practices જાળવવા માટે Banking Companiesને Directions આપી શકે છે.

આ સત્તા દ્વારા RBI Credit Discipline જાળવી શકે છે અને અતિશય અથવા જોખમી Lendingને નિયંત્રિત કરી શકે છે.

13. Cash Reserve
Section 18
English

Section 18 contains provisions relating to the Cash Reserve of banking companies.

The statutory framework requires banking companies to maintain the prescribed cash reserve in accordance with RBI requirements.

ગુજરાતી

Section 18 Banking Companiesના Cash Reserve અંગે જોગવાઈ કરે છે.

Banking Companiesએ RBI દ્વારા લાગુ કરવામાં આવેલી કાયદાકીય જરૂરિયાતો અનુસાર નિર્ધારિત Cash Reserve જાળવવાનું હોય છે.

14. Power of RBI to Inspect Banks
Section 35
English

Section 35 gives RBI the power to inspect a banking company.

RBI may examine:

Books of accounts.
Records.
Statements.
Transactions.
Assets and liabilities.
Overall affairs of the banking company.

The purpose is to determine whether the bank is conducting its affairs properly and in accordance with law.

ગુજરાતી

Section 35 RBIને Banking Companyનું Inspection કરવાની સત્તા આપે છે.

RBI નીચેની બાબતોની તપાસ કરી શકે છે:

Books of Accounts
Records
Statements
Transactions
Assets અને Liabilities
Banking Companyની સમગ્ર કામગીરી

આનો હેતુ એ છે કે બેંક કાયદા અનુસાર યોગ્ય રીતે કાર્ય કરે છે કે નહીં તેની તપાસ કરી શકાય.

⭐ Exam Point

Section 35 = Inspection

15. Power of RBI to Issue Directions
English

RBI has powers under the Act to issue directions to banking companies in specified circumstances.

Such directions help RBI ensure:

Proper management
Depositor protection
Financial stability
Compliance with banking law
Sound banking practices

ગુજરાતી

કાયદા હેઠળ RBIને ચોક્કસ પરિસ્થિતિઓમાં Banking Companiesને Directions આપવાની સત્તા છે.

આ Directions દ્વારા:

યોગ્ય Management
Depositorsનું Protection
Financial Stability
Banking Lawનું Compliance
Sound Banking Practices

જાળવવામાં મદદ મળે છે.

16. Power to Remove Managerial Persons
Section 36AA
English

Under Section 36AA, RBI has statutory power, subject to the conditions of the Act, to order the removal of a person from office where the statutory requirements are satisfied and such action is considered necessary in the public interest or for proper management.

ગુજરાતી

Section 36AA હેઠળ કાયદામાં જણાવેલી શરતો પૂર્ણ થતી હોય ત્યારે RBIને ચોક્કસ પરિસ્થિતિમાં Banking Companyના Managementમાં રહેલી વ્યક્તિને પદ પરથી દૂર કરવાનો આદેશ આપવાની સત્તા છે.

આ સત્તાનો ઉપયોગ Public Interest અને બેંકના યોગ્ય Management માટે થઈ શકે છે.

17. Amalgamation of Banking Companies
Section 44A
English

Section 44A provides a statutory framework for the amalgamation of banking companies.

Amalgamation means combining two or more banking companies into one entity according to the legal procedure.

The provision requires compliance with the statutory scheme and RBI-related requirements.

ગુજરાતી

Section 44A Banking Companiesના Amalgamation માટે કાયદાકીય માળખું પૂરું પાડે છે.

Amalgamation એટલે બે અથવા વધુ Banking Companiesનું કાયદાકીય પ્રક્રિયા અનુસાર એક સંસ્થામાં વિલીનીકરણ.

આ પ્રક્રિયામાં કાયદામાં નક્કી કરેલી પ્રક્રિયા અને RBI સંબંધિત આવશ્યકતાઓનું પાલન કરવું પડે છે.

⭐ Exam Point

Section 44A = Amalgamation

18. Reconstruction of Banking Companies
English

The Act also provides a framework for the reconstruction or reorganisation of banking companies in appropriate circumstances.

The objective is to protect depositors and maintain the continuity and stability of banking operations.

ગુજરાતી

યોગ્ય પરિસ્થિતિમાં Banking Companyના Reconstruction અથવા Reorganisation માટે પણ કાયદામાં વ્યવસ્થા છે.

19. Power to Impose Penalties
English

The Act provides for penalties for contravention of its provisions and for certain offences.

Where a banking company or responsible person violates applicable statutory requirements, legal consequences may follow according to the relevant provisions.

ગુજરાતી

Banking Regulation Actની જોગવાઈઓના ઉલ્લંઘન માટે કાયદામાં Penalties અને કેટલીક પરિસ્થિતિમાં Offences અંગે જોગવાઈ કરવામાં આવી છે.

Banking Company અથવા જવાબદાર વ્યક્તિ કાયદાકીય આવશ્યકતાઓનું ઉલ્લંઘન કરે તો સંબંધિત જોગવાઈ અનુસાર Legal Consequences આવી શકે છે.

20. Protection of Depositors
English

Protection of depositors is one of the central objectives underlying banking regulation.

Through licensing, supervision, inspection, prudential regulation and control over management, the Act seeks to ensure that banking companies operate in a manner that protects depositors' interests.

ગુજરાતી

Depositorsનું Protection Banking Regulationનો એક મુખ્ય હેતુ છે.

Licensing, Supervision, Inspection, Prudential Regulation અને Management ઉપર નિયંત્રણ દ્વારા Banking Companies Depositorsના હિતોને નુકસાન ન પહોંચાડે તે સુનિશ્ચિત કરવાનો પ્રયાસ કરવામાં આવે છે.

English

The Act is important because it:

Creates a statutory framework for banking regulation.
Gives RBI significant supervisory powers.
Protects depositors.
Regulates the establishment and expansion of banks.
Controls certain lending activities.
Provides for inspection and supervision.
Regulates banking management.
Provides mechanisms for reconstruction and amalgamation.
Promotes sound banking practices.
Supports stability and confidence in the banking system.

ગુજરાતી

આ કાયદાનું મહત્વ:

Banking Regulation માટે કાયદાકીય માળખું આપે છે.
RBIને મહત્વપૂર્ણ Supervisory Powers આપે છે.
Depositorsનું રક્ષણ કરે છે.
બેંકોની સ્થાપના અને વિસ્તરણનું નિયમન કરે છે.
ચોક્કસ Lending Activities ઉપર નિયંત્રણ રાખે છે.
Inspection અને Supervisionની વ્યવસ્થા કરે છે.
Banking Managementનું નિયમન કરે છે.
Reconstruction અને Amalgamation માટે વ્યવસ્થા આપે છે.
Sound Banking Practicesને પ્રોત્સાહન આપે છે.
Banking Systemમાં Stability અને Confidence જાળવવામાં મદદ કરે છે.

23. Conclusion
English

The Banking Regulation Act, 1949 is a fundamental legislation governing the regulation and supervision of banking companies in India. It provides RBI with wide statutory powers relating to licensing, branch expansion, management, lending, inspection, directions, reconstruction and amalgamation.

The overall purpose of the Act is to ensure that banking companies operate in a safe, sound and lawful manner and that the interests of depositors and the stability of the banking system are protected.

Banks અને Financial Institutionsના નાણાકીય હિતોનું રક્ષણ કરવું.
Non-Performing Loansની Recovery Mechanismને સુધારવી.
Debt Recovery માટે અસરકારક કાયદાકીય વ્યવસ્થા પૂરી પાડવી.
Recovery Casesનો સમયસર નિકાલ કરવો.

3. Constitution of DRT
Section 3
English

Under Section 3 of the RDB Act, the Central Government may establish one or more Debts Recovery Tribunals to exercise jurisdiction, powers and authority under the Act.

Each DRT consists of a Presiding Officer.

The Presiding Officer is appointed by the Central Government in accordance with the Act.

ગુજરાતી

RDB Actની Section 3 હેઠળ Central Government એક અથવા વધુ Debts Recovery Tribunals સ્થાપી શકે છે.

દરેક DRTમાં એક Presiding Officer હોય છે.

Presiding Officerની નિમણૂક Central Government દ્વારા કાયદાની જોગવાઈઓ અનુસાર કરવામાં આવે છે.

⭐ Exam Point

Section 3 = Establishment / Constitution of DRT

4. Qualifications of Presiding Officer
English

The Presiding Officer must possess the qualifications prescribed under the Act.

The purpose of prescribing qualifications is to ensure that the person heading the Tribunal has appropriate judicial or legal experience.

ગુજરાતી

Presiding Officer માટે કાયદા હેઠળ જરૂરી Qualifications નક્કી કરવામાં આવી છે.

તેનો હેતુ એ છે કે Tribunalનું નેતૃત્વ કરનાર વ્યક્તિ પાસે યોગ્ય Judicial અથવા Legal Experience હોય.

5. Term of Office
English

The term of office, conditions of service and related matters concerning the Presiding Officer are governed by the applicable provisions of the RDB Act and rules made thereunder.

ગુજરાતી

Presiding Officerનો Term of Office, Service Conditions અને સંબંધિત બાબતો RDB Act તથા તેના હેઠળ બનાવવામાં આવેલા Rules દ્વારા નિયંત્રિત થાય છે.

6. Appellate Tribunal
Section 8
English

The Act also provides for the establishment of Debts Recovery Appellate Tribunals (DRATs).

A person aggrieved by an order of the DRT may, subject to the provisions of the Act, prefer an appeal before the appropriate Debts Recovery Appellate Tribunal.

ગુજરાતી

આ કાયદા હેઠળ **Debts Recovery Appellate Tribunal (DRAT)**ની પણ વ્યવસ્થા કરવામાં આવી છે.

DRTના Orderથી કોઈ વ્યક્તિ અસંતુષ્ટ હોય તો કાયદાની જોગવાઈઓને આધિન રહીને તે યોગ્ય DRAT સમક્ષ Appeal કરી શકે છે.

⭐ Exam Point

DRT → First level
DRAT → Appellate level

7. Jurisdiction of DRT
Section 17
English

Section 17 is one of the most important provisions concerning the jurisdiction of DRT.

The DRT has jurisdiction to entertain and decide applications from banks and financial institutions for the recovery of debts due to them.

The Tribunal can determine the amount of debt due and take steps under the Act for recovery.

ગુજરાતી

Section 17 DRTના Jurisdiction માટે ખૂબ જ મહત્વપૂર્ણ છે.

DRTને Banks અને Financial Institutions દ્વારા કરવામાં આવેલી Debt Recovery Applicationsની સુનાવણી અને નિર્ણય કરવાની સત્તા છે.

Tribunal બાકી દેવાની રકમ નક્કી કરી શકે છે અને કાયદા હેઠળ તેની Recovery માટે જરૂરી કાર્યવાહી કરી શકે છે.

⭐ Important

Section 17 = Jurisdiction, powers and authority of DRT

8. What is "Debt"?
Section 2(g)
English

The definition of "debt" is important for determining the jurisdiction of DRT.

Broadly, debt refers to any liability, whether secured or unsecured, which is alleged as due from any person and includes certain amounts payable under a legal liability.

The exact scope is governed by the statutory definition under Section 2(g).

ગુજરાતી

DRTનું Jurisdiction સમજવા માટે **"Debt"**ની Definition ખૂબ મહત્વપૂર્ણ છે.

સામાન્ય રીતે Debt એટલે કોઈ વ્યક્તિ પાસેથી કાયદેસર રીતે વસૂલ કરવાની બાકી Liability. તે Secured અથવા Unsecured હોઈ શકે છે.

Debtની ચોક્કસ વ્યાખ્યા **Section 2(g)**માં આપવામાં આવી છે.

⭐ Exam Point

Section 2(g) = Debt

9. Who Can Approach DRT?
English

The primary applicants before DRT are:

Banks
Financial institutions
Other entities covered by the statutory framework

They may file an application for recovery of debts due to them.

ગુજરાતી

DRT સમક્ષ મુખ્યત્વે નીચેની સંસ્થાઓ Debt Recovery માટે અરજી કરી શકે છે:

Banks
Financial Institutions
કાયદા હેઠળ આવતી અન્ય પાત્ર સંસ્થાઓ

આ સંસ્થાઓ તેમની બાકી રકમની Recovery માટે DRTમાં Application કરી શકે છે.

10. Jurisdiction Over Civil Courts
Section 17 and Section 18
English

The RDB Act creates a specialised mechanism for debt recovery and provides for exclusion of the jurisdiction of ordinary civil courts in matters falling within the jurisdiction of DRT, subject to the statutory scheme and judicial interpretation.

Section 18 deals with the bar of jurisdiction and provides that courts and authorities cannot exercise jurisdiction in matters specified in the Act, except as provided by the Act.

ગુજરાતી

RDB Act હેઠળ Debt Recovery માટે Specialized Mechanism બનાવવામાં આવ્યો છે.

DRTના Jurisdictionમાં આવતી બાબતો અંગે સામાન્ય Civil Courtsના Jurisdictionને કાયદાની યોજના અનુસાર મર્યાદિત કરવામાં આવ્યું છે.

Section 18 Jurisdictionના Bar અંગે મહત્વપૂર્ણ જોગવાઈ કરે છે.

⭐ Exam Point

Section 17 → DRT Jurisdiction
Section 18 → Bar of Jurisdiction

11. Application to DRT
Section 19
English

Section 19 deals with applications to the Tribunal.

A bank or financial institution seeking recovery of a debt may make an application before the DRT having jurisdiction.

The application must contain the relevant facts, details of the debt and supporting documents.

ગુજરાતી

Section 19 DRT સમક્ષ Application અંગેની જોગવાઈ કરે છે.

Bank અથવા Financial Institution પોતાની બાકી રકમની Recovery માટે યોગ્ય Jurisdiction ધરાવતા DRTમાં Application કરી શકે છે.

Applicationમાં Debt સંબંધિત Facts, Amount અને Supporting Documents રજૂ કરવામાં આવે છે.

12. Procedure of DRT
English

DRT is not required to follow the complete procedure of a regular civil court in the same manner.

The Tribunal is guided by the principles of natural justice and follows the statutory procedure prescribed by the RDB Act and applicable rules.

The objective is to ensure a fair hearing while facilitating speedy disposal.

ગુજરાતી

DRTને સામાન્ય Civil Court જેવી સંપૂર્ણ Procedure અનુસરવાની ફરજ નથી.

Tribunal Principles of Natural Justiceને અનુસરે છે અને RDB Act તથા લાગુ Rules હેઠળની Procedure પ્રમાણે કાર્યવાહી કરે છે.

હેતુ એ છે કે પક્ષકારોને Fair Hearing મળે અને Caseનો ઝડપી નિકાલ થાય.

13. Powers of DRT

DRTને કાયદા હેઠળ વિવિધ મહત્વપૂર્ણ powers આપવામાં આવી છે.

A. Power to Summon and Enforce Attendance
English

The Tribunal has powers to summon persons and require their attendance for examination.

It can also require production of relevant documents and records.

ગુજરાતી

DRT વ્યક્તિઓને Summon કરી શકે છે અને તેમની હાજરી ફરજિયાત કરી શકે છે.

તે જરૂરી Documents અને Records પણ રજૂ કરવા કહી શકે છે.

14. Power to Receive Evidence
English

The Tribunal can receive evidence and examine relevant material for deciding the dispute.

It can consider documentary evidence and other legally relevant material.

ગુજરાતી

DRT કેસના નિર્ણય માટે Evidence સ્વીકારી શકે છે અને સંબંધિત પુરાવાની તપાસ કરી શકે છે.

તે Documentary Evidence અને અન્ય સંબંધિત સામગ્રીને ધ્યાનમાં લઈ શકે છે.

15. Power to Require Discovery and Production of Documents
English

The Tribunal can direct parties to disclose and produce documents relevant to the proceedings.

This power assists the Tribunal in determining the actual debt and other disputed facts.

ગુજરાતી

DRT પક્ષકારોને Case સાથે સંબંધિત Documents disclose અને produce કરવાનો આદેશ આપી શકે છે.

આ સત્તા દ્વારા Tribunalને Actual Debt અને અન્ય વિવાદિત હકીકતો નક્કી કરવામાં મદદ મળે છે.

16. Power to Review its Orders
English

Subject to the statutory provisions, the Tribunal has power to review its orders in appropriate circumstances.

ગુજરાતી

કાયદાની જોગવાઈઓને આધિન રહીને DRT યોગ્ય પરિસ્થિતિમાં પોતાના Ordersનું Review કરી શકે છે.

17. Power to Set Aside Ex Parte Orders
English

Where an order has been passed ex parte, the Tribunal may, subject to statutory conditions, consider an application for setting aside such order.

ગુજરાતી

જો કોઈ પક્ષકારની ગેરહાજરીમાં Ex Parte Order કરવામાં આવ્યો હોય, તો કાયદામાં નક્કી કરેલી શરતોને આધિન રહીને Tribunal તેને Set Aside કરવા અંગેની Application પર વિચાર કરી શકે છે.

18. Recovery of Debt
English

After determining the amount due, the Tribunal may issue a Recovery Certificate.

The Recovery Officer then takes steps for recovery in accordance with the Act.

ગુજરાતી

Tribunal બાકી રકમ નક્કી કર્યા પછી Recovery Certificate issue કરી શકે છે.

ત્યારબાદ Recovery Officer Act અનુસાર બાકી રકમની Recovery માટે કાર્યવાહી કરે છે.

19. Recovery Officer
English

The Act provides for Recovery Officers who are responsible for executing recovery certificates and taking measures for recovery of amounts due.

They may take measures authorised by the Act, including attachment and sale of property in appropriate cases.

ગુજરાતી

RDB Act હેઠળ Recovery Officerની વ્યવસ્થા છે.

Recovery Officerનું મુખ્ય કાર્ય Tribunal દ્વારા આપવામાં આવેલા Recovery Certificateને અમલમાં મૂકવાનું અને કાયદા અનુસાર બાકી રકમની Recovery કરવાનું છે.

યોગ્ય પરિસ્થિતિમાં તે Propertyની Attachment અને Sale જેવી કાર્યવાહી કરી શકે છે.

20. Attachment and Sale of Property
English

For recovery of the amount due, the Recovery Officer may, subject to the Act, take measures such as:

Attachment of property.
Sale of attached property.
Taking possession in appropriate circumstances.
Other modes of recovery permitted by law.

ગુજરાતી

બાકી રકમની Recovery માટે Recovery Officer કાયદા અનુસાર:

Propertyની Attachment કરી શકે છે.
Attached Propertyની Sale કરી શકે છે.
યોગ્ય પરિસ્થિતિમાં Possession લઈ શકે છે.
કાયદા દ્વારા મંજૂર અન્ય Recovery Measures લઈ શકે છે.

21. Interim Orders
English

The Tribunal can pass appropriate interim orders where necessary to protect the subject matter of the proceedings and prevent frustration of recovery proceedings, subject to the Act.

ગુજરાતી

Caseની કાર્યવાહી દરમિયાન Recoveryને નુકસાન ન થાય અથવા Propertyને સુરક્ષિત રાખવાની જરૂર હોય ત્યારે Tribunal કાયદાની મર્યાદામાં Interim Orders આપી શકે છે.

22. Appeal Against DRT Order
Section 20
English

A person aggrieved by an order of the DRT may prefer an appeal to the Debts Recovery Appellate Tribunal (DRAT) in accordance with Section 20 and the applicable statutory conditions.

The appeal must be filed within the prescribed period, subject to the provisions relating to condonation of delay where applicable.

ગુજરાતી

DRTના Orderથી અસંતુષ્ટ વ્યક્તિ Section 20 હેઠળ Debts Recovery Appellate Tribunal (DRAT) સમક્ષ Appeal કરી શકે છે.

Appeal કાયદામાં નક્કી કરેલી સમયમર્યાદામાં કરવી પડે છે. યોગ્ય પરિસ્થિતિમાં Delay Condonation અંગેની જોગવાઈ લાગુ પડી શકે છે.

23. Pre-deposit for Appeal
English

The Act contains provisions requiring a person against whom a debt has been determined to deposit a prescribed portion of the debt before an appeal can be entertained, subject to the power of the Appellate Tribunal to reduce the amount in accordance with the statutory framework.

This requirement is intended to discourage frivolous appeals and protect recovery interests.

ગુજરાતી

કાયદામાં કેટલીક પરિસ્થિતિમાં DRTના Order સામે Appeal દાખલ કરવા માટે Prescribed Pre-deposit કરવાની જોગવાઈ છે.

Statutory framework મુજબ Appellate Tribunalને કેટલીક પરિસ્થિતિમાં આ રકમ ઘટાડવાની સત્તા પણ હોઈ શકે છે.

25. Importance of DRT
English

DRTs are important because they:

Provide a specialised forum for debt recovery.
Facilitate faster disposal of recovery applications.
Reduce the burden on ordinary courts.
Strengthen the recovery mechanism for banks.
Help deal with large outstanding debts.
Provide a statutory recovery mechanism.
Improve financial discipline.
Support the banking and financial system.

DRTનું મહત્વ:

Debt Recovery માટે Specialized Forum આપે છે.
Recovery Applicationsનો ઝડપી નિકાલ કરવામાં મદદ કરે છે.
સામાન્ય Courtsનો ભાર ઘટાડે છે.
Banksની Recovery Mechanismને મજબૂત બનાવે છે.
મોટી બાકી રકમના Casesના નિકાલમાં મદદ કરે છે.
Statutory Recovery Mechanism પૂરો પાડે છે.
Financial Discipline સુધારવામાં મદદ કરે છે.
Banking અને Financial Systemને મજબૂત બનાવવામાં મદદ કરે છે.

28. Conclusion
English

The Debts Recovery Tribunal is an important specialised institution for recovery of debts due to banks and financial institutions. The Recovery of Debts and Bankruptcy Act, 1993 provides the legal framework for its constitution, jurisdiction, powers and procedure.

The DRT system aims to provide a specialised and effective mechanism for adjudicating debt claims and implementing recovery through Recovery Officers. The appellate structure through the DRAT provides an additional legal remedy against orders of the DRT.

Thus, DRT plays an important role in strengthening the debt recovery mechanism and supporting stability and discipline in the banking and financial sector.

ગુજરાતી

Debts Recovery Tribunal (DRT) Banks અને Financial Institutionsને બાકી રહેલી રકમની Recovery માટેનું મહત્વપૂર્ણ Specialized Institution છે. Recovery of Debts and Bankruptcy Act, 1993 DRTની Constitution, Jurisdiction, Powers અને Procedure માટે કાનૂની માળખું પૂરું પાડે છે.

DRTનો હેતુ Debt Claimsની Specialized અને Effective Adjudication કરવો તથા Recovery Officer દ્વારા Recoveryની કાર્યવાહી કરાવવાનો છે. DRTના Orders સામે DRATમાં Appeal કરવાની વ્યવસ્થા પણ આપવામાં આવી છે.

આ રીતે DRT ભારતમાં Debt Recovery Mechanismને મજબૂત બનાવવામાં અને Banking તથા Financial Sectorમાં Financial Discipline જાળવવામાં મહત્વપૂર્ણ ભૂમિકા ભજવે છે.`

The Securitisation and Reconstruction of Financial Assets and Enforcement of Security Interest Act, 2002, commonly known as the SARFAESI Act, 2002, is an important legislation relating to recovery of secured debts in India.

Securitisation of financial assets

Enforcement of security interest
Recovery of secured debts without ordinary court intervention, subject to the statutory scheme.

The Act enables certain secured creditors to enforce security interests against secured assets when a borrower defaults, subject to the requirements and safeguards provided by the Act.

ગુજરાતી

Securitisation and Reconstruction of Financial Assets and Enforcement of Security Interest Act, 2002, જેને સામાન્ય રીતે SARFAESI Act, 2002 કહેવામાં આવે છે, ભારતમાં Secured Debtની Recovery માટેનો મહત્વપૂર્ણ કાયદો છે.

આ કાયદો મુખ્યત્વે નીચેની બાબતો માટે કાનૂની માળખું આપે છે:

Financial Assetsનું Securitisation
Financial Assetsનું Reconstruction
Security Interestનું Enforcement
કાયદામાં નક્કી કરેલી પ્રક્રિયા અને safeguardsને આધિન રહીને સામાન્ય Court intervention વિના Secured Debtની Recovery.

2. Objectives of SARFAESI Act
English

The main objectives of the SARFAESI Act are:

To facilitate speedy recovery of secured debts.
To enable secured creditors to enforce security interests.
To reduce dependence on lengthy court proceedings.
To provide a framework for securitisation of financial assets.
To provide for reconstruction of financial assets.
To improve recovery of non-performing assets (NPAs).
To strengthen the financial system.
To enable Asset Reconstruction Companies (ARCs) to acquire financial assets.
To provide mechanisms for sale or management of secured assets.
To balance the rights of secured creditors with statutory remedies available to borrowers.

ગુજરાતી

SARFAESI Actના મુખ્ય હેતુઓ:

Secured Debtની ઝડપી Recovery કરવી.
Secured Creditorsને Security Interest enforce કરવાની સત્તા આપવી.
લાંબી Court Proceedings પરની નિર્ભરતા ઘટાડવી.
Financial Assetsના Securitisation માટે કાનૂની વ્યવસ્થા કરવી.
Financial Assetsના Reconstruction માટે માળખું પૂરું પાડવું.
**Non-Performing Assets (NPAs)**ની Recovery સુધારવી.
Financial Systemને મજબૂત બનાવવું.
**Asset Reconstruction Companies (ARCs)**ને Financial Assets acquire કરવાની વ્યવસ્થા આપવી.
Secured Assetsના Sale અથવા Management માટે વ્યવસ્થા કરવી.
Secured Creditorsના હિતો અને Borrowersને મળતા કાયદાકીય Remedies વચ્ચે સંતુલન જાળવવું.

3. Important Definitions
A. Financial Asset
English

A financial asset includes debt or receivables and other assets of the nature specified under the Act.

It can include claims relating to financial obligations and certain secured or unsecured interests.

ગુજરાતી

Financial Assetમાં Debt અથવા Receivables તથા Act હેઠળ નિર્ધારિત અન્ય પ્રકારની Financial Assetsનો સમાવેશ થાય છે.

4. Secured Creditor
English

A secured creditor means a bank or financial institution and includes other categories of creditors recognised under the Act who hold a security interest.

Examples may include:

Banks
Financial institutions
Debenture trustees in specified circumstances
Asset Reconstruction Companies and other eligible entities covered by the Act

ગુજરાતી

Secured Creditor એટલે એવી બેંક, Financial Institution અથવા Act હેઠળ માન્ય અન્ય સંસ્થા કે જેના હિતમાં Security Interest હોય.

ઉદાહરણ:

Banks
Financial Institutions
ચોક્કસ પરિસ્થિતિમાં Debenture Trustees
Asset Reconstruction Companies
Act હેઠળ આવતી અન્ય પાત્ર સંસ્થાઓ

5. Security Interest
English

Security interest means a right, title or interest of a secured creditor in secured assets created in its favour.

It may arise through:

Mortgage
Hypothecation
Assignment
Pledge
Charge
Other interests recognised under the Act

ગુજરાતી

Security Interest એટલે Secured Creditorના હિતમાં Secured Asset ઉપર ઉભો થતો Right, Title અથવા Interest.

તે નીચેની રીતે ઊભો થઈ શકે છે:

Mortgage
Hypothecation
Assignment
Pledge
Charge
Act હેઠળ માન્ય અન્ય Security Interest

6. Non-Performing Asset (NPA)
English

A major concept under the SARFAESI framework is the Non-Performing Asset (NPA).

When a borrower fails to meet repayment obligations and the account is classified as an NPA in accordance with applicable RBI norms and law, the secured creditor may take steps available under the SARFAESI Act, subject to statutory conditions.

ગુજરાતી

SARFAESIમાં Non-Performing Asset (NPA) ખૂબ મહત્વપૂર્ણ Concept છે.

જ્યારે Borrower પોતાની Repayment Obligations પૂર્ણ કરવામાં નિષ્ફળ જાય અને લાગુ RBI Norms અને કાયદા અનુસાર Accountને NPA તરીકે Classify કરવામાં આવે, ત્યારે Secured Creditor SARFAESI Act હેઠળ ઉપલબ્ધ કાર્યવાહી કરી શકે છે, જો કાયદાકીય શરતો પૂર્ણ થતી હોય.

7. Applicability of the Act
English

The Act applies to enforcement of security interests and other matters covered by its statutory framework.

However, the Act does not apply to every kind of asset or transaction. Section 31 specifies certain cases to which the provisions of the Act do not apply.

Therefore, in an examination answer, it is important to mention that SARFAESI operates subject to the exclusions and limitations contained in the Act.

ગુજરાતી

SARFAESI Act તેના કાયદાકીય માળખામાં આવતી Security Interestની Enforcement અને અન્ય સંબંધિત બાબતોને લાગુ પડે છે.

પરંતુ દરેક પ્રકારની Asset અથવા દરેક Transaction પર આ Act લાગુ પડતો નથી. Section 31માં કેટલીક એવી પરિસ્થિતિઓ જણાવવામાં આવી છે જેમાં SARFAESI Actની જોગવાઈઓ લાગુ પડતી નથી.

8. Measures Available to Secured Creditor
Section 13

આ SARFAESI Actનો સૌથી મહત્વપૂર્ણ Section છે.

English

Under Section 13, a secured creditor can enforce security interest without the intervention of the court or tribunal, subject to the conditions prescribed by the Act.

Where a borrower makes a default and the account is classified as an NPA, the secured creditor may issue a demand notice requiring the borrower to discharge the liability within the statutory period.

Section 13(2) – Demand Notice
English

Under Section 13(2), where a borrower has made a default and the account has been classified as an NPA, the secured creditor may issue a written notice requiring the borrower to discharge the liability in full within 60 days from the date of the notice.

The notice specifies the amount payable and the secured assets intended to be enforced.

ગુજરાતી

Section 13(2) મુજબ જ્યારે Borrower Default કરે અને Account NPA તરીકે classify થાય ત્યારે Secured Creditor Borrowerને Written Demand Notice આપી શકે છે.

Borrowerએ Noticeની તારીખથી 60 દિવસની અંદર પોતાની Liability ચૂકવવાની હોય છે.

Noticeમાં સામાન્ય રીતે:

બાકી રકમ
Security Interest
જે Secured Assets ઉપર કાર્યવાહી થવાની છે

તે અંગેની વિગતો હોય છે.

⭐ Exam Point

Section 13(2) = 60 Days Demand Notice

9. Borrower's Objection to Demand Notice
Section 13(3A)
English

If the borrower makes any representation or raises an objection to the demand notice, the secured creditor is required to consider it.

If the secured creditor does not accept the objection, it must communicate the reasons for non-acceptance within the statutory framework.

ગુજરાતી

જો Borrower **Section 13(2)**ની Notice સામે કોઈ Representation અથવા Objection કરે, તો Secured Creditorએ તેને ધ્યાનમાં લેવું પડે છે.

જો Creditor Borrower's objection સ્વીકારતો ન હોય, તો લાગુ કાયદાકીય માળખા અનુસાર તેના rejectionના કારણો જણાવવાના હોય છે.

10. Measures under Section 13(4)

જો Borrower 60 દિવસની Demand Notice પછી પણ Liability ચૂકવતો નથી, તો Secured Creditor Section 13(4) હેઠળ નીચેની Measures લઈ શકે છે.

A. Take Possession of Secured Assets
English

The secured creditor may take possession of the secured assets of the borrower.

ગુજરાતી

Secured Creditor Borrowerની Secured Propertyનો Possession લઈ શકે છે.

ઉદાહરણ તરીકે:

Borrowerએ Bank પાસેથી Loan લીધું અને પોતાની Property Mortgage કરી. Default પછી કાયદાની પ્રક્રિયા અનુસાર Bank Security Interest enforce કરીને Propertyનો Possession લઈ શકે છે.

11. Take Over Management
English

In appropriate cases, the secured creditor may take over the management of the business of the borrower.

This measure is subject to the statutory requirements and limitations.

ગુજરાતી

યોગ્ય પરિસ્થિતિમાં Secured Creditor Borrower's Businessનું Management Take Over કરી શકે છે.

પરંતુ આ કાર્યવાહી કાયદામાં નક્કી કરેલી શરતો અને મર્યાદાઓને આધિન છે.

12. Appoint a Manager
English

The secured creditor may appoint a person to manage the secured assets taken over by it.

ગુજરાતી

Secured Creditor પોતાના કબજામાં લીધેલી Secured Assetsનું Management કરવા માટે Managerની નિમણૂક કરી શકે છે.

13. Sale or Transfer of Secured Assets
English

The secured creditor may sell or transfer the secured assets to realise the outstanding dues.

The sale must be carried out according to the applicable statutory rules and procedure.

ગુજરાતી

Secured Creditor પોતાની બાકી રકમની Recovery માટે Secured Assetsને Sell અથવા Transfer કરી શકે છે.

પરંતુ Sale કાયદા અને લાગુ Rulesમાં નક્કી કરેલી Procedure અનુસાર થવી જોઈએ.

14. Section 13(4) in Simple Form
English

Remember the four major measures:

P → Possession
M → Management
M → Manager
S → Sale

ગુજરાતી

Section 13(4) માટે યાદ રાખો:

P = Possession
M = Management
M = Manager
S = Sale

આ 20 marksના answerમાં ખાસ લખવા જેવું છે.

15. Central Registry
CERSAI
English

The SARFAESI framework provides for a Central Registry for registration of transactions relating to securitisation, reconstruction of financial assets and creation of security interests.

The system is associated with the Central Registry of Securitisation Asset Reconstruction and Security Interest of India (CERSAI).

Its purpose includes preventing fraudulent multiple financing and improving transparency concerning security interests.

ગુજરાતી

SARFAESI Act હેઠળ Central Registryની વ્યવસ્થા છે જેમાં Securitisation, Reconstruction of Financial Assets અને Creation of Security Interests સંબંધિત Transactionsનું Registration કરવામાં આવે છે.

આ વ્યવસ્થા CERSAI સાથે સંબંધિત છે.

તેનો હેતુ:

Multiple Financingના Fraudને રોકવામાં મદદ કરવી
Security Interestsમાં Transparency વધારવી
Lendersને existing security interests વિશે માહિતી ઉપલબ્ધ કરાવવી

છે.

16. Asset Reconstruction Company (ARC)
English

An Asset Reconstruction Company (ARC) is a company registered with the RBI for the purposes permitted under the SARFAESI Act.

An ARC may acquire financial assets from banks and financial institutions and undertake asset reconstruction activities in accordance with the law.

ગુજરાતી

Asset Reconstruction Company (ARC) એટલે SARFAESI Act હેઠળ માન્ય હેતુઓ માટે RBI સાથે Registered Company.

ARC Banks અને Financial Institutions પાસેથી Financial Assets acquire કરી શકે છે અને કાયદા અનુસાર Asset Reconstructionની કામગીરી કરી શકે છે.

17. Securitisation
English

Securitisation involves the acquisition of financial assets and related processes through which financial assets may be converted into marketable or transferable interests in accordance with the statutory framework.

It allows financial institutions to manage and restructure their financial assets.

ગુજરાતી

Securitisation એટલે Financial Assetsને કાયદાકીય માળખા અનુસાર Acquire અને Structure કરવાની પ્રક્રિયા, જેના દ્વારા Financial Assetsને Marketable અથવા Transferable Interestsમાં રૂપાંતરિત કરવાની વ્યવસ્થા થઈ શકે છે.

તે Financial Institutionsને તેમની Financial Assetsનું Management અને Restructuring કરવામાં મદદ કરે છે.

18. Asset Reconstruction
English

Asset reconstruction refers to the process of resolving or restructuring financial assets acquired by an ARC or otherwise dealt with under the Act.

It may involve measures such as:

Rescheduling of payments
Enforcement of security
Settlement of dues
Change in management
Sale or lease of business in appropriate cases
Other measures permitted by law

ગુજરાતી

Asset Reconstruction એટલે Financial Assetsને Resolve, Restructure અથવા Recover કરવાની પ્રક્રિયા.

તેમાં કાયદા મુજબ:

Paymentનું Rescheduling
Securityનું Enforcement
Duesનું Settlement
Managementમાં Change
યોગ્ય પરિસ્થિતિમાં Businessનું Sale અથવા Lease
કાયદા હેઠળ મંજૂર અન્ય Measures

નો સમાવેશ થઈ શકે છે.

19. Right of Appeal to DRT
Section 17
English

A borrower or any person aggrieved by any of the measures referred to in Section 13(4) may make an application to the Debts Recovery Tribunal (DRT) under Section 17.

This is an important safeguard available to the borrower.

The DRT examines whether the measures taken by the secured creditor are in accordance with the Act and the applicable law.

ગુજરાતી

Section 13(4) હેઠળ Secured Creditor દ્વારા લેવામાં આવેલી Measuresથી Borrower અથવા અન્ય Aggrieved Person અસંતુષ્ટ હોય તો તે Section 17 હેઠળ DRTમાં Application કરી શકે છે.

આ Borrower માટેનું ખૂબ મહત્વપૂર્ણ Legal Remedy છે.

DRT તપાસી શકે છે કે Secured Creditor દ્વારા લેવામાં આવેલી કાર્યવાહી SARFAESI Act અને લાગુ કાયદા અનુસાર છે કે નહીં.

⭐ Exam Point

Section 13(4) → Creditor's Enforcement Action
Section 17 → Borrower's Remedy before DRT

20. Appeal to DRAT
Section 18
English

A person aggrieved by an order made by the DRT under Section 17 may prefer an appeal to the Debts Recovery Appellate Tribunal (DRAT) under Section 18, subject to the statutory requirements.

The Act also contains provisions regarding pre-deposit for an appeal.

ગુજરાતી

Section 17 હેઠળ DRT દ્વારા આપવામાં આવેલા Orderથી કોઈ વ્યક્તિ અસંતુષ્ટ હોય તો તે Section 18 હેઠળ DRAT સમક્ષ Appeal કરી શકે છે, કાયદાકીય શરતોને આધિન રહીને.

Appeal માટે Actમાં Pre-deposit સંબંધિત જોગવાઈ પણ છે.

21. Jurisdiction of Civil Court
Section 34
English

Section 34 is an important provision concerning the jurisdiction of civil courts.

It provides that no civil court shall have jurisdiction to entertain any suit or proceeding in respect of any matter which a DRT or DRAT is empowered by or under the Act to determine.

The Act therefore creates a specialised mechanism for matters falling within its statutory field.

ગુજરાતી

Section 34 ખૂબ જ મહત્વપૂર્ણ છે.

તે મુજબ જે બાબતો અંગે SARFAESI Act હેઠળ DRT અથવા DRATને નિર્ણય કરવાની સત્તા આપવામાં આવી છે, તેવી બાબતો અંગે સામાન્ય Civil Courtને Jurisdiction નથી.

આથી SARFAESI Act પોતાનું Specialized Legal Mechanism બનાવે છે.

⭐ Exam Point

Section 34 = Bar of Civil Court Jurisdiction

22. Limitation of SARFAESI Act
English

SARFAESI is not applicable to every type of secured asset or every type of transaction.

Section 31 provides important exclusions.

For examination purposes, mention that the Act contains statutory exclusions and therefore its application must always be tested against Section 31 and other relevant provisions.

ગુજરાતી

SARFAESI Act દરેક પ્રકારની Property અથવા દરેક પ્રકારના Transaction પર લાગુ પડતો નથી.

Section 31માં કેટલીક મહત્વપૂર્ણ exclusions આપવામાં આવી છે.

Examમાં લખવું:
SARFAESI Act is subject to the exclusions contained in Section 31.

23. Borrower's Rights
English

The SARFAESI Act does not completely remove the rights of borrowers.

Important safeguards include:

Receipt of demand notice under Section 13(2).
Right to make representation or objection under Section 13(3A).
Right to approach DRT under Section 17 after measures under Section 13(4).
Right of appeal to DRAT under Section 18.
Right to challenge actions that are contrary to the Act and applicable rules.

ગુજરાતી

SARFAESI Act Borrower's Rightsને સંપૂર્ણપણે દૂર કરતો નથી.

Borrower પાસે મહત્વપૂર્ણ Safeguards છે:

Section 13(2) હેઠળ Demand Notice મેળવવાનો અધિકાર.
Section 13(3A) હેઠળ Representation/Objection કરવાનો અધિકાર.
Section 17 હેઠળ DRTમાં જવાનો અધિકાર.
Section 18 હેઠળ DRATમાં Appeal કરવાનો અધિકાર.
Act અથવા Rules વિરુદ્ધ થયેલી કાર્યવાહી સામે કાયદા અનુસાર Challenge કરવાનો અધિકાર.

24. Advantages of SARFAESI Act
English

The Act provides several important benefits:

Faster recovery mechanism.
Reduces lengthy litigation in appropriate cases.
Helps banks deal with NPAs.
Enables enforcement of security interests.
Promotes financial discipline.
Provides a specialised remedy through DRT.
Supports asset reconstruction.
Strengthens the banking system.

ગુજરાતી

SARFAESI Actના લાભો:

ઝડપી Recovery Mechanism.
યોગ્ય કેસોમાં લાંબી Litigation ઘટાડે છે.
Banksને NPAsની Recoveryમાં મદદ કરે છે.
Security Interest enforce કરવાની વ્યવસ્થા આપે છે.
Financial Discipline વધારે છે.

The word Negotiable means transferable from one person to another in such a manner that the transferee may obtain the right to receive the money represented by the instrument, subject to the law.

Cheque

Promissory Note

The principal instruments under the Act are:

A written instrument containing an unconditional undertaking signed by the maker to pay a certain sum of money to a certain person, his order or the bearer, as provided by law.

A written instrument containing an unconditional order, signed by the maker, directing a certain person to pay a certain sum of money to a certain person, his order or the bearer.

The promise or order to pay must be unconditional.

Conditional:

A holder of a negotiable instrument can generally enforce the instrument and sue in his own name, subject to the provisions of law.

Negotiation transfers the instrument in such a manner that the transferee becomes the holder.

English

Under Section 118, until the contrary is proved, certain presumptions apply to negotiable instruments.

According to Section 4, a Promissory Note is an instrument in writing, containing an unconditional undertaking, signed by the maker, to pay a certain sum of money only to, or to the order of, a certain person, or to the bearer of the instrument.

આ ભાગ exam માટે ખૂબ જ મહત્વપૂર્ણ છે.

1. It must be in writing

A Promissory Note must be in writing.

An oral promise to pay money is not a Promissory Note.

Invalid:

1. Introduction

A Bill of Exchange is one of the principal negotiable instruments recognized under the Negotiable Instruments Act, 1881.

It is used mainly in commercial and credit transactions. Unlike a Promissory Note, which contains a promise to pay, a Bill of Exchange contains an unconditional order to pay.

Gujarati

Bill of Exchange એટલે વિનિમય પત્ર.

તે Negotiable Instruments Act, 1881 હેઠળનું એક મહત્વપૂર્ણ Negotiable Instrument છે.

Promissory Noteમાં ચૂકવણી કરવાનું વચન (Promise) હોય છે, જ્યારે Bill of Exchangeમાં ચૂકવણી કરવાનો આદેશ (Order) હોય છે.

2. Definition of Bill of Exchange
Section 5 of the Negotiable Instruments Act, 1881

According to Section 5, a Bill of Exchange is an instrument in writing containing an unconditional order, signed by the maker, directing a certain person to pay a certain sum of money only to, or to the order of, a certain person or to the bearer of the instrument.

Simple Definition

A Bill of Exchange is a written and signed unconditional order by one person directing another person to pay a certain sum of money to a specified person or his order/bearer.

Gujarati

કલમ 5 મુજબ, Bill of Exchange એ એવું લખિત instrument છે જેમાં એક વ્યક્તિ બીજી ચોક્કસ વ્યક્તિને ચોક્કસ રકમની બિનશરતી ચુકવણી કરવાનો આદેશ આપે છે.

3. Example of Bill of Exchange

Suppose A sells goods worth ₹1,00,000 to B on credit.

A writes:

“B, pay ₹1,00,000 to C or order on 1 January 2027.”

A signs the document.

Here:

A = Drawer
B = Drawee
C = Payee
₹1,00,000 = Certain Sum
“Pay” = Order to Pay

If B accepts the Bill, B becomes the Acceptor.

Gujarati

ધારો કે A એ B ને ₹1,00,000નો માલ Credit પર વેચ્યો.

A, B ને કહે છે:

“B, 1 January 2027ના રોજ C અથવા તેના Orderને ₹1,00,000 ચૂકવો.”

અહીં:

A = Drawer
B = Drawee
C = Payee
₹1,00,000 = ચોક્કસ રકમ
Pay = ચુકવણીનો આદેશ

B Bill સ્વીકારે ત્યારે B Acceptor બને છે.

4. Parties to a Bill of Exchange

Bill of Exchangeમાં સામાન્ય રીતે ત્રણ મુખ્ય પક્ષકારો હોય છે.

1. Drawer

The person who makes and signs the Bill of Exchange and gives the order to pay is called the Drawer.

Gujarati

જે વ્યક્તિ Bill of Exchange બનાવે છે અને બીજી વ્યક્તિને રકમ ચૂકવવાનો આદેશ આપે છે તેને Drawer કહે છે.

Example: A makes the Bill → A is Drawer.

2. Drawee

The person who is directed by the Drawer to pay the money is called the Drawee.

Gujarati

જે વ્યક્તિને Drawer દ્વારા રકમ ચૂકવવાનો આદેશ આપવામાં આવે છે તેને Drawee કહે છે.

Example: A orders B to pay → B is Drawee.

3. Payee

The person to whom the money is directed to be paid is called the Payee.

Gujarati

જે વ્યક્તિને રકમ ચૂકવવાની હોય તેને Payee કહેવામાં આવે છે.

Example: A orders B to pay C → C is Payee.

5. Acceptor

The Drawee becomes an Acceptor when he accepts the Bill of Exchange.

Acceptance means that the Drawee agrees to pay the Bill according to its terms.

Gujarati

Drawee જ્યારે Billને સ્વીકારે છે ત્યારે તે Acceptor બને છે.

Acceptance એટલે Drawee Billની શરતો અનુસાર રકમ ચૂકવવા માટે સંમત થાય છે.

Example

A → B: “Pay ₹50,000 to C.”

B accepts the Bill.

Therefore:

B = Acceptor

6. Essential Characteristics of Bill of Exchange

આ ભાગ 20 marks માટે સૌથી મહત્વપૂર્ણ છે.

1. It must be in writing

A Bill of Exchange must be in written form.

An oral order to pay money is not a Bill of Exchange.

Gujarati

Bill of Exchange લખિત હોવું જરૂરી છે.

માત્ર મૌખિક આદેશ Bill of Exchange બની શકતો નથી.

2. There must be an order to pay

A Bill must contain an order to pay, not merely a request or information.

Example:

“Pay B ₹50,000.”

This indicates an order.

Gujarati

Billમાં રકમ ચૂકવવાનો આદેશ હોવો જોઈએ.

માત્ર વિનંતી અથવા માહિતી હોવી પૂરતી નથી.

7. The Order Must Be Unconditional

The order to pay must be unconditional.

Valid:

“Pay B ₹50,000.”

Invalid:

“Pay B ₹50,000 if you receive the goods.”

The second order is conditional.

Gujarati

ચૂકવણીનો આદેશ બિનશરતી હોવો જોઈએ.

Valid:
“B ને ₹50,000 ચૂકવો.”

Invalid:
“માલ મળી જાય તો B ને ₹50,000 ચૂકવો.”

બીજું વાક્ય શરતી છે.

8. It Must Be Signed by the Drawer

The Bill must be signed by the person who makes it, i.e. the Drawer.

Gujarati

Bill of Exchange પર Drawerની સહી હોવી આવશ્યક છે.

9. Drawee Must Be Certain

The person who is directed to make payment must be certain.

Gujarati

જે વ્યક્તિને ચુકવણી કરવાનો આદેશ આપવામાં આવે છે તે ચોક્કસ વ્યક્તિ હોવી જોઈએ.

10. Payee Must Be Certain

The person to whom the amount is payable must be certain.

Gujarati

જે વ્યક્તિને રકમ ચૂકવવાની છે તે ચોક્કસ વ્યક્તિ હોવી જોઈએ.

11. Amount Must Be Certain

The amount payable must be certain.

Example:

“Pay ₹75,000.”

Here the amount is certain.

Gujarati

ચૂકવવાની રકમ ચોક્કસ હોવી જોઈએ.

12. Payment Must Be in Money

The Bill must order payment of money only.

Valid:

“Pay ₹1,00,000.”

Invalid:

“Pay 100 bags of wheat.”

Gujarati

Bill of Exchangeમાં માત્ર નાણાં ચૂકવવાનો આદેશ હોવો જોઈએ.

માલ, વસ્તુ અથવા અન્ય property આપવાનો આદેશ Bill of Exchange નથી.

13. It Must Be Payable to a Certain Person, His Order or Bearer

The Bill must specify the person to whom payment is to be made, or may be payable to his order or bearer as permitted by law.

Gujarati

ચુકવણી ચોક્કસ વ્યક્તિને, તેના Order મુજબ અથવા કાયદા મુજબ Bearerને કરવાની હોય છે.

14. It May Be Payable on Demand or at a Definite Time

A Bill may be payable:

On demand
On a specified date
After a specified period
Gujarati

Billની ચુકવણી:

Demand પર
ચોક્કસ તારીખે
ચોક્કસ સમયગાળા પછી

થઈ શકે છે.

15. Acceptance of Bill

Acceptance is an important feature of a Bill of Exchange.

The Drawee accepts the Bill by signing it, thereby agreeing to pay according to its terms.

Gujarati

Bill of Exchangeમાં Acceptance ખૂબ મહત્વપૂર્ણ છે.

Drawee જ્યારે Bill સ્વીકારે છે અને સહી કરે છે ત્યારે તે તેની શરતો અનુસાર ચુકવણી કરવાની જવાબદારી સ્વીકારે છે.

16. Types of Acceptance

Acceptance can broadly be:

1. General Acceptance

The Drawee accepts the Bill without adding conditions or qualifications.

Gujarati

General Acceptance એટલે કોઈ શરત અથવા ફેરફાર કર્યા વગર Bill સ્વીકારવો.

2. Qualified Acceptance

The Drawee accepts the Bill subject to some condition or qualification.

Examples may relate to:

Amount
Time
Place
Parties
Gujarati

Qualified Acceptance એટલે Drawee કોઈ શરત, મર્યાદા અથવા ફેરફાર સાથે Bill સ્વીકારે.

17. Types of Bill of Exchange

Bill of Exchange can be classified in different ways.

A. Inland Bill

A Bill drawn and payable within the statutory requirements relating to India is generally called an Inland Bill.

Gujarati

ભારત સંબંધિત કાયદાકીય માપદંડો અનુસાર ભારતમાં drawn અને payable થતો Bill Inland Bill કહેવાય છે.

B. Foreign Bill

A Bill that falls within the statutory definition of a foreign bill is called a Foreign Bill.

Gujarati

કાયદા મુજબ વિદેશ સાથે સંબંધિત Billને Foreign Bill કહેવામાં આવે છે.

C. Demand Bill

A Bill payable on demand is called a Demand Bill.

Gujarati

જે Bill Demand પર payable હોય તેને Demand Bill કહેવામાં આવે છે.

D. Time Bill

A Bill payable after a specified period or on a specified future date is called a Time Bill.

Gujarati

જે Bill ચોક્કસ સમયગાળા પછી અથવા ચોક્કસ ભવિષ્યની તારીખે payable હોય તેને Time Bill કહેવામાં આવે છે.

18. Negotiation of Bill of Exchange

A Bill of Exchange is a negotiable instrument.

Negotiation means transfer of the instrument in such a manner that the transferee becomes its holder.

It may take place through:

1. Delivery

In the case of a bearer instrument, negotiation may generally take place by delivery.

2. Endorsement and Delivery

In the case of an order instrument, negotiation generally takes place by endorsement and delivery.

Gujarati

Bill of Exchangeનું Negotiation થઈ શકે છે.

Negotiation એટલે Billને એવી રીતે transfer કરવું કે transferee તેનો Holder બને.

મુખ્ય રીતે:

Delivery દ્વારા
Endorsement અને Delivery દ્વારા
19. Endorsement

Section 15 deals with endorsement.

When the maker or holder signs the instrument for the purpose of negotiation, it is called endorsement.

Gujarati

કલમ 15 Endorsement સાથે સંબંધિત છે.

Holder અથવા instrumentનો અધિકૃત વ્યક્તિ Billની પાછળ અથવા તેના પર સહી કરીને તેને બીજા વ્યક્તિને transfer કરે તેને Endorsement કહેવામાં આવે છે.

20. Liability of Drawer

The Drawer has liability under the Act subject to its conditions.

If the Bill is dishonoured by the Drawee or Acceptor and the necessary requirements are fulfilled, the Drawer may become liable to compensate the holder.

Gujarati

જો Drawee/Acceptor Billની ચુકવણી કરવામાં નિષ્ફળ જાય અને કાયદાકીય જરૂરી શરતો પૂર્ણ કરવામાં આવી હોય, તો Drawerની પણ જવાબદારી ઊભી થઈ શકે છે.

21. Liability of Acceptor

Once the Drawee accepts the Bill, the Acceptor becomes primarily liable to pay the amount according to the terms of the Bill.

Gujarati

Drawee Bill accept કર્યા પછી Acceptor બને છે અને Billની શરતો અનુસાર રકમ ચૂકવવાની મુખ્ય જવાબદારી તેની હોય છે.

22. Dishonour of Bill

A Bill of Exchange may be dishonoured in two main ways:

1. Dishonour by Non-Acceptance

When the Drawee refuses or fails to accept the Bill, it is called dishonour by non-acceptance.

Gujarati

Drawee Bill accept ન કરે તો તેને Dishonour by Non-Acceptance કહેવાય છે.

2. Dishonour by Non-Payment

When the accepted Bill is not paid when it becomes due, it is called dishonour by non-payment.

Gujarati

Bill accept થયા પછી maturity પર રકમ ચૂકવવામાં ન આવે તો તેને Dishonour by Non-Payment કહે છે.

23. Notice of Dishonour

When a Bill is dishonoured, the holder may be required to give notice of dishonour to parties against whom he intends to proceed, subject to statutory rules and exceptions.

Gujarati

Bill dishonour થાય ત્યારે જે પક્ષકારો સામે કાયદેસર કાર્યવાહી કરવાની હોય તેમને કાયદાની જોગવાઈ મુજબ Notice of Dishonour આપવાની જરૂર પડી શકે છે.

24. Holder and Holder in Due Course
Holder

A person entitled in his own name to possession of the instrument and to receive or recover the amount due is called the Holder.

Gujarati

જે વ્યક્તિને પોતાના નામે instrument રાખવાનો અને તેની રકમ મેળવવાનો કાયદેસર હક હોય તેને Holder કહેવામાં આવે છે.

Holder in Due Course

A person who acquires the instrument for consideration, before maturity, and in the circumstances recognized by law, is a Holder in Due Course.

Gujarati

જે વ્યક્તિ consideration આપીને, maturity પહેલાં અને કાયદા મુજબ સદ્ભાવનાથી instrument મેળવે તેને Holder in Due Course કહેવામાં આવે છે.

25. Presumptions under Section 118

Section 118 provides certain statutory presumptions regarding negotiable instruments unless the contrary is proved.

Important presumptions include:

Consideration
Date
Time of acceptance
Time of transfer
Order of endorsements
Stamp
Holder in due course

Date
Acceptanceનો સમય

Holder in Due Course

17. Meaning of Crossing

Crossing means drawing two parallel transverse lines on the face of a cheque, with or without additional words.

Crossing affects the manner in which the cheque may be paid.

Gujarati

Chequeના આગળના ભાગ પર બે સમાનાંતર રેખાઓ દોરવામાં આવે અને તેમાં જરૂરી શબ્દો લખવામાં આવે તેને Crossing કહે છે.

Crossingના મુખ્ય હેતુઓ:

To provide greater security.
To prevent payment directly over the counter in ordinary crossed cheques.
To ensure payment through a bank.
To reduce the risk of wrongful encashment.
To identify the banking channel through which payment is made.
To facilitate tracing of the payment.

ખોટી રીતે encashment થવાનું જોખમ ઘટાડવું.
Paymentનો banking channel નક્કી કરવો.

1. General Crossing
2. Special Crossing
3. Restrictive / Account Payee Crossing

4. Not Negotiable Crossing

Section 123

Where a cheque bears across its face:

two parallel transverse lines, or
two such lines with words such as “and company” or “not negotiable”,

it is said to be generally crossed.

Example:
     //        //
   ₹50,000
   Pay B
Gujarati

Section 123 મુજબ chequeના આગળના ભાગ પર:

બે સમાનાંતર રેખાઓ દોરવામાં આવે અથવા તેમાં “and company”, “Not Negotiable” જેવા શબ્દો હોય તો તેને General Crossing કહેવામાં આવે છે.

Effect

A generally crossed cheque is paid through a banker rather than ordinarily in cash directly over the counter.

21. Special Crossing
Section 124

Where a cheque bears across its face the name of a banker, with or without the words “not negotiable”, it is said to be specially crossed.

Example:

Gujarati

Section 124 મુજબ cheque પર કોઈ ચોક્કસ Bankerનું નામ લખવામાં આવે અને crossing કરવામાં આવે તો તેને Special Crossing કહેવામાં આવે છે.

Example:

// HDFC BANK //

23. Not Negotiable Crossing
Section 130

When a crossed cheque bears the words “Not Negotiable”, it means that the transferee cannot get a better title than the transferor had, subject to the statutory rule.

Important

“Not Negotiable” does NOT mean “Not Transferable.”

This is a very important exam point.

Cheque પર “Not Negotiable” લખવાથી તેનો અર્થ એ નથી કે cheque transfer જ થઈ શકતો નથી.

તેનો અર્થ એ છે કે transfereeને transferor કરતાં સારો title મળતો નથી.

The words “A/C Payee” or “A/C Payee Only” are commonly used to indicate that the proceeds should be credited to the account of the named payee, subject to banking practice and applicable rules.

30. Conclusion
English

A Holder is a person who is legally entitled in his own name to possess a negotiable instrument and receive or recover the amount due on it under Section 8 of the Negotiable Instruments Act, 1881.

A Holder in Due Course, defined under Section 9, is a special category of Holder who acquires the instrument for consideration, before maturity, and without sufficient cause to believe that the transferor's title is defective.

1. Introduction
English

Endorsement is an important method of negotiation of a negotiable instrument. When the holder of a negotiable instrument signs on the instrument for the purpose of negotiating it to another person, it is called endorsement.

ગુજરાતી

Endorsement (પૃષ્ઠાંકન) એ negotiable instrument ને એક વ્યક્તિ પાસેથી બીજી વ્યક્તિને transfer અથવા negotiate કરવાની મહત્વપૂર્ણ રીત છે. જ્યારે instrument નો holder instrument પર સહી કરીને તેને બીજી વ્યક્તિને transfer કરે છે, ત્યારે તેને Endorsement કહેવામાં આવે છે.

2. Definition of Endorsement
Section 15, Negotiable Instruments Act, 1881
English

According to Section 15, when the maker or holder of a negotiable instrument signs the same, otherwise than as such maker, for the purpose of negotiation, on the back or face thereof or on a slip of paper annexed thereto, he is said to endorse the same.

The person making the endorsement is called the Endorser, and the person in whose favour it is made is called the Endorsee.

ગુજરાતી

Section 15 મુજબ, negotiable instrument નો maker અથવા holder, instrument ને negotiate કરવાના હેતુથી તેની પાછળ અથવા આગળની બાજુએ અથવા તેની સાથે જોડાયેલા slip પર સહી કરે, તેને Endorsement કહેવામાં આવે છે.

સહી કરનાર વ્યક્તિ = Endorser
જેના favour માં endorsement કરવામાં આવે = Endorsee
Easy Example

A પાસે ₹50,000 નો cheque છે. A cheque ની પાછળ સહી કરીને B ને આપે છે.

અહીં:

A = Endorser
B = Endorsee
3. Essentials of a Valid Endorsement

Valid endorsement માટે નીચેની બાબતો જરૂરી છે:

1. It must be on the instrument

English: Endorsement should normally be made on the instrument or on an attached slip called an allonge.

ગુજરાતી: Endorsement instrument પર અથવા તેની સાથે જોડાયેલા paper/slip પર થવું જોઈએ.

2. Signature of Endorser

English: The endorsement must contain the signature of the endorser.

ગુજરાતી: Endorsement કરનાર વ્યક્તિની સહી જરૂરી છે.

3. Purpose must be negotiation

English: The signature must be made with the intention of negotiating the instrument.

ગુજરાતી: સહી કરવાનો હેતુ instrument ને બીજી વ્યક્તિને negotiate/transfer કરવાનો હોવો જોઈએ.

4. Endorsement must relate to the whole instrument

English: Generally, an endorsement should be of the whole amount of the instrument and not merely a part of it.

ગુજરાતી: સામાન્ય રીતે આખા instrument નું endorsement થવું જોઈએ. માત્ર instrument ની એક ભાગની રકમનું endorsement સામાન્ય રીતે માન્ય નથી.

5. Delivery

English: Endorsement is completed by delivery of the instrument to the endorsee.

ગુજરાતી: માત્ર સહી કરવાથી પૂરતું નથી. Instrument ની delivery પણ જરૂરી છે.

4. Types of Endorsement

Endorsement ના મુખ્ય પ્રકારો:

Blank Endorsement
Full/Special Endorsement
Restrictive Endorsement
Conditional/Qualified Endorsement
Sans Recourse Endorsement
Partial Endorsement
5. Blank Endorsement
English

According to Section 16, when the endorser signs his name only, without specifying the person to whom the instrument is payable, it is called Blank Endorsement.

Example

Cheque:

Pay A or Order

A માત્ર પાછળ સહી કરે:

A

આ Blank Endorsement છે.

ગુજરાતી

જ્યારે Endorser માત્ર પોતાની સહી કરે છે અને Endorsee નું નામ લખતો નથી, ત્યારે તેને Blank Endorsement કહે છે.

Effect

Blank endorsed instrument ઘણી વખત bearer instrument જેવી રીતે transfer થઈ શકે છે, subject to the provisions of the Act.

6. Full or Special Endorsement
English

When the endorser specifies the person to whom or to whose order the instrument is payable, it is called Full Endorsement.

Pay B or Order
A

અહીં A એ B ના favour માં endorsement કર્યું છે.

7. Restrictive Endorsement
English

An endorsement that restricts or prohibits further negotiation of the instrument is called a Restrictive Endorsement.

Example

અહીં B સિવાય આગળ instrument negotiate કરી શકાતું નથી.

ગુજરાતી

જે endorsement instrument ના આગળના negotiation ને restrict અથવા prohibit કરે છે તેને Restrictive Endorsement કહે છે.

અર્થાત્ instrument માત્ર B માટે છે.

English

When the liability of the endorser is made subject to a condition, it is called a Conditional or Qualified Endorsement.

જ્યારે endorsement સાથે કોઈ condition જોડવામાં આવે અને Endorser ની liability તે condition પર આધારિત હોય, ત્યારે તેને Conditional અથવા Qualified Endorsement કહે છે.

When the endorser excludes or limits his own liability to subsequent holders, it is called a Sans Recourse Endorsement.

અર્થાત્ જો instrument dishonour થાય તો B પછીનો holder A સામે liability માટે claim કરી શકશે નહીં, subject to applicable law.

When only a part of the amount of the instrument is endorsed, it is called partial endorsement.

જ્યારે instrument ની માત્ર કેટલીક રકમ બીજી વ્યક્તિને transfer કરવામાં આવે ત્યારે તેને Partial Endorsement કહે છે.

13. Meaning of Dishonour of Cheque
English

A cheque is said to be dishonoured when the bank refuses or fails to make payment of the cheque when it is duly presented for payment.

ગુજરાતી

જ્યારે cheque ને યોગ્ય રીતે bank માં payment માટે રજૂ કરવામાં આવે અને bank cheque નું payment refuse કરે અથવા payment કરવામાં નિષ્ફળ જાય, ત્યારે cheque નું Dishonour કહેવાય છે.

સરળ ભાષામાં:

Cheque presented + Bank does not pay = Dishonour

1. Dishonour by Non-Acceptance
2. Dishonour by Non-Payment

પરંતુ Cheque ના સંદર્ભમાં મુખ્યત્વે Dishonour by Non-Payment મહત્વપૂર્ણ છે.

A Bill of Exchange may be dishonoured by non-acceptance when the drawee refuses to accept the bill.

English

A negotiable instrument is dishonoured by non-payment when the maker, acceptor or drawee, as the case may be, makes default in payment when payment is duly required.

ગુજરાતી

જ્યારે negotiable instrument ની payment યોગ્ય રીતે demand કરવામાં આવે છતાં maker, acceptor અથવા drawee payment કરવામાં default કરે ત્યારે Dishonour by Non-Payment થાય છે.

Cheque માં આ સૌથી important છે.

17. Main Reasons for Dishonour of Cheque

Cheque dishonour થવાના common reasons:

1. Insufficient Funds

Account માં પૂરતા પૈસા ન હોય.

ગુજરાતી: Account balance cheque amount કરતાં ઓછું હોય.

2. Signature Mismatch

Cheque પરની signature અને bank records માં રહેલી signature match ન થાય.

ગુજરાતી: Cheque ની સહી bank ના specimen signature સાથે match ન થાય.

3. Account Closed

Drawer નું bank account બંધ થઈ ગયું હોય.

Drawer એ bank ને payment stop કરવા instruction આપ્યું હોય.

5. Exceeds Arrangement

Account holder ને bank દ્વારા આપવામાં આવેલી sanctioned arrangement/limit કરતાં વધારે amount નું cheque હોય.

6. Post-Dated Cheque Presented Early

Post-dated cheque તેની તારીખ પહેલાં રજૂ કરવામાં આવે.

7. Stale Cheque

Cheque તેની validity period પછી રજૂ કરવામાં આવે.

8. Material Alteration

Cheque માં unauthorized/material alteration હોય.

9. Account Frozen

કાયદાકીય અથવા અન્ય valid reason ના કારણે account માં payment restriction હોય.

10. Other Bank-Specified Reasons

Banking/payment rules મુજબ અન્ય યોગ્ય કારણોસર પણ cheque return થઈ શકે છે.

18. Section 138: Dishonour of Cheque

આ exam માટે સૌથી important section છે.

Section 138, Negotiable Instruments Act, 1881
English

Section 138 deals with Dishonour of cheque for insufficiency of funds in the account.

If a cheque is dishonoured because the amount of money standing to the credit of the account is insufficient, or it exceeds the arrangement made with the bank, and the statutory requirements are fulfilled, the drawer may be liable for criminal punishment under Section 138.

ગુજરાતી

Section 138 cheque dishonour સંબંધિત ખૂબ જ મહત્વપૂર્ણ provision છે.

જો cheque:

account માં insufficient funds ના કારણે dishonour થાય, અથવા
bank સાથેની arrangement/limit કરતાં વધારે amount હોવાના કારણે dishonour થાય,

અને Section 138 ની તમામ statutory conditions પૂર્ણ થાય, તો drawer સામે criminal liability ઊભી થઈ શકે છે.

19. Essential Conditions of Section 138

Section 138 લાગુ થવા માટે નીચેની મુખ્ય conditions મહત્વપૂર્ણ છે:

Condition 1: Cheque must be drawn

Cheque drawer દ્વારા તેના bank account માંથી payment માટે draw થયેલો હોવો જોઈએ.

ગુજરાતી: Drawer એ પોતાના account પર cheque issue કર્યો હોવો જોઈએ.

Condition 2: Legally Enforceable Debt or Liability

Cheque કોઈ legally enforceable debt or other liability ના સંપૂર્ણ અથવા આંશિક discharge માટે આપેલો હોવો જોઈએ.

ગુજરાતી: Cheque પાછળ કાયદેસર રીતે વસૂલ કરી શકાય તેવી debt અથવા liability હોવી જરૂરી છે.

Condition 3: Presentation within Valid Period

Cheque તેની validity દરમિયાન bank માં present કરવો જોઈએ.

Important current point: Cheque ની validity સામાન્ય રીતે 3 months છે, subject to applicable banking instructions.

Condition 4: Dishonour

Cheque bank દ્વારા dishonour થવો જોઈએ.

ગુજરાતી: Bank એ cheque નું payment ન કરવું જોઈએ.

Condition 5: Written Demand Notice

Payee અથવા holder in due course એ bank પાસેથી dishonour ની માહિતી મળ્યા પછી 30 દિવસની અંદર written demand notice drawer ને આપવી જોઈએ.

Condition 6: 15 Days Payment Period

Drawer ને notice મળ્યા પછી 15 દિવસની અંદર payment કરવાની તક મળે છે.

જો drawer 15 દિવસની અંદર payment કરી દે, તો Section 138 ની criminal liability સામાન્ય રીતે arise થતી નથી.

Condition 7: Complaint

જો drawer notice મળ્યા બાદ 15 દિવસની અંદર payment ન કરે, તો cause of action ઊભું થાય છે અને payee/holder in due course કાયદા મુજબ complaint કરી શકે છે within the prescribed limitation.
