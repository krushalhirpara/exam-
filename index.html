21. Punishment under Section 138
English

On conviction under Section 138, the drawer may be punished with:

Imprisonment up to 2 years, or
Fine up to twice the amount of the cheque, or
Both.
ગુજરાતી

Section 138 હેઠળ conviction થાય તો:

2 વર્ષ સુધીની imprisonment, અથવા
Cheque amount ના બે ગણા સુધીનો fine, અથવા
બંને

થઈ શકે છે.

22. Presumption under Section 139
English

Section 139 creates a presumption in favour of the holder that the cheque was received for the discharge, in whole or in part, of a debt or other liability, subject to the statutory requirements and rebuttal by the accused.

ગુજરાતી

Section 139 મુજબ, holder ના favour માં statutory presumption ઊભી થાય છે કે cheque કોઈ debt અથવા liability ના સંપૂર્ણ અથવા આંશિક discharge માટે મળ્યો હતો.

Drawer/accused આ presumption ને legally rebut કરી શકે છે.

23. Section 140

Section 140 કેટલાક circumstances માં drawer ને કેટલાક defence પર આધાર રાખવાથી રોકે છે.

Exam માં લખી શકો:

Section 140 limits certain defences available to the drawer in a prosecution under Section 138.

24. Section 141

જો cheque dishonour કરનાર drawer company હોય, તો Section 141 હેઠળ company અને કેટલીક પરિસ્થિતિમાં business માટે responsible persons ની liability સંબંધિત provisions લાગુ પડે છે.

ગુજરાતી

Company દ્વારા cheque issue કરવામાં આવ્યો હોય અને તે dishonour થાય, તો Section 141 હેઠળ company તથા કાયદામાં નિર્ધારિત જવાબદાર વ્યક્તિઓ અંગે criminal liability ના નિયમો લાગુ પડે છે.

25. Section 142
English

Section 142 deals with cognizance of offences under Section 138 and contains important provisions relating to complaint.

ગુજરાતી

Section 142 Section 138 ના offence અંગે complaint અને court દ્વારા cognizance સંબંધિત provisions આપે છે.

26. Notice of Dishonour
English

When a negotiable instrument is dishonoured, notice of dishonour may be required to be given to persons who are liable, subject to the provisions of the Act.

ગુજરાતી

Negotiable instrument dishonour થાય ત્યારે, Act મુજબ liable parties ને Notice of Dishonour આપવાની requirement થઈ શકે છે.

Purpose
Drawer/liable party ને જાણ કરવી.
Payment કરવાની તક આપવી.
Legal liability enforce કરવામાં મદદ કરવી.
Subsequent legal proceedings માટે evidence તૈયાર કરવું.
27. Bank Return Memo

Cheque dishonour થાય ત્યારે bank સામાન્ય રીતે Cheque Return Memo આપે છે.

તેમાં dishonour નું reason દર્શાવવામાં આવે છે.

Example:

“Funds Insufficient”

અથવા

“Payment Stopped by Drawer”

ગુજરાતી

Return Memo cheque dishonour થયાનો મહત્વપૂર્ણ documentary evidence બની શકે છે.

28. Difference Between Dishonour and Bounce
English

In common banking language, cheque bounce is generally used when a cheque is returned unpaid.

Legally, the consequences depend on the reason for dishonour and whether statutory conditions under Section 138 are satisfied.

ગુજરાતી

સામાન્ય ભાષામાં Cheque Bounce અને Cheque Dishonour શબ્દો ઘણી વખત એક જ અર્થમાં વપરાય છે.

પરંતુ legal liability માટે માત્ર cheque return થવું પૂરતું નથી. Section 138 ની statutory conditions પણ પૂર્ણ થવી જરૂરી છે.

29. Important Rights of Payee

Cheque dishonour થાય ત્યારે payee:

Bank return memo મેળવી શકે છે.
Applicable case માં demand notice આપી શકે છે.
Drawer ને statutory payment opportunity આપી શકે છે.
Payment ન થાય તો Section 138 હેઠળ complaint કરી શકે છે, subject to legal requirements.
Appropriate civil remedies પણ facts પ્રમાણે available હોઈ શકે છે.

34. Conclusion
English

Endorsement plays an important role in the negotiation and transfer of negotiable instruments. It enables the holder to transfer his rights to another person. Different forms of endorsement determine the extent of transfer and liability of the endorser.

Dishonour of cheque, particularly under Section 138, provides a statutory mechanism to protect the credibility of cheque transactions. However, prosecution requires compliance with the statutory conditions relating to presentation, dishonour, notice, payment period and limitation.

ગુજરાતી

Endorsement negotiable instruments ના negotiation અને transfer માટે ખૂબ જ મહત્વપૂર્ણ છે. Endorsement દ્વારા holder પોતાના rights બીજી વ્યક્તિને transfer કરી શકે છે અને endorsement ના પ્રકાર પ્રમાણે rights તથા liability નક્કી થાય છે.

    // Navigate to Topic Dedicated Page
    function navigateToTopic(index) {
      window.location.hash = `topic-${index + 1}`;
    }

    // Switch Views based on URL Hash
    function handleRoute() {
      const hash = window.location.hash;

      if (hash.startsWith('#topic-')) {
        const topicNum = parseInt(hash.replace('#topic-', ''), 10);
        if (!isNaN(topicNum) && topicNum >= 1 && topicNum <= TOPICS_DATA.length) {
          showTopicPage(topicNum - 1);
          return;
        }
      }

      // Default: Show Home Grid
      showHomePage();
    }

    function showHomePage() {
      document.getElementById('home-view').classList.remove('hidden');
      document.getElementById('topic-view').classList.add('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showTopicPage(index) {
      currentTopicIndex = index;
      const topic = TOPICS_DATA[index];

      // Hide Grid, Show Page
      document.getElementById('home-view').classList.add('hidden');
      document.getElementById('topic-view').classList.remove('hidden');

      // Update Page Headers
      document.getElementById('page-topic-badge').innerText = topic.number;
      document.getElementById('page-topic-subtitle').innerText = topic.subtitle;
      document.getElementById('content-topic-badge').innerText = topic.number;
      document.getElementById('page-topic-title').innerText = topic.title;
      document.getElementById('content-topic-subtitle').innerText = topic.subtitle;

      // Update Navigation Buttons (Top and Bottom)
      const isFirst = index === 0;
      const isLast = index === TOPICS_DATA.length - 1;

      document.getElementById('top-btn-prev').disabled = isFirst;
      document.getElementById('top-btn-next').disabled = isLast;
      document.getElementById('top-btn-prev').classList.toggle('opacity-40', isFirst);
      document.getElementById('top-btn-next').classList.toggle('opacity-40', isLast);

      document.getElementById('bottom-btn-prev').disabled = isFirst;
      document.getElementById('bottom-btn-next').disabled = isLast;
      document.getElementById('bottom-btn-prev').classList.toggle('opacity-40', isFirst);
      document.getElementById('bottom-btn-next').classList.toggle('opacity-40', isLast);

      if (!isFirst) {
        document.getElementById('bottom-prev-label').innerText = `← ${TOPICS_DATA[index - 1].number}`;
      } else {
        document.getElementById('bottom-prev-label').innerText = `Previous Topic`;
      }

      if (!isLast) {
        document.getElementById('bottom-next-label').innerText = `${TOPICS_DATA[index + 1].number} →`;
      } else {
        document.getElementById('bottom-next-label').innerText = `Next Topic`;
      }

      // Render Verbatim Text Content
      renderContent(topic.content);

      window.scrollTo({ top: 0, behavior: 'smooth' });
      lucide.createIcons();
    }

    function goHome() {
      window.location.hash = '';
    }

    function navigateTopic(delta) {
      const target = currentTopicIndex + delta;
      if (target >= 0 && target < TOPICS_DATA.length) {
        navigateToTopic(target);
      }
    }

    // Render Verbatim Text with Clean Formatting for Exam Notes
    function renderContent(rawText) {
      const body = document.getElementById('page-content-body');
      body.innerHTML = '';

      const lines = rawText.split('\n');
      let tableBuffer = [];
      let inTable = false;

      const container = document.createElement('div');
      container.className = 'space-y-4';

      lines.forEach((line) => {
        // Table line detection (contains '|' or tab)
        if (line.trim().startsWith('|') || (line.includes('|') && line.trim().endsWith('|')) || line.includes('\t') || (line.includes(' | '))) {
          tableBuffer.push(line);
          inTable = true;
          return;
        } else if (inTable) {
          container.appendChild(createTable(tableBuffer));
          tableBuffer = [];
          inTable = false;
        }

        // Section alerts, headers, Gujarati tags, English tags, subheaders, and paragraphs
        if (line.startsWith('PART ') || line.match(/^[A-Z]\.\s+[A-Z\s]{4,}/)) {
          const part = document.createElement('h2');
          part.className = 'text-xl sm:text-2xl font-heading font-extrabold text-brand-700 mt-8 mb-3 pb-2 border-b-2 border-brand-100 tracking-wide';
          part.innerText = line;
          container.appendChild(part);
        } else if (line.match(/^\d+\.\s+[A-Za-z0-9]/) || line.startsWith('Section ') || line.startsWith('કલમ ')) {
          const sec = document.createElement('h3');
          sec.className = 'text-lg sm:text-xl font-heading font-bold text-slate-900 mt-6 mb-2 flex items-center gap-2';
          sec.innerText = line;
          container.appendChild(sec);
        } else if (line.match(/^[A-Z]\.\s+[A-Za-z0-9]/)) {
          const subSec = document.createElement('h4');
          subSec.className = 'text-base sm:text-lg font-heading font-bold text-brand-800 mt-6 mb-2 flex items-center gap-2 border-l-4 border-brand-500 pl-3 py-0.5 bg-brand-50/50 rounded-r-lg';
          subSec.innerText = line;
          container.appendChild(subSec);
        } else if (line.trim() === 'Gujarati' || line.trim() === 'ગુજરાતી' || line.trim() === 'Gujarati:' || line.trim() === 'Gujarati Explanation' || line.trim() === 'Gujarati Example' || line.trim() === 'Gujarati Conclusion') {
          const guj = document.createElement('div');
          guj.className = 'inline-block px-3 py-1 rounded-full text-xs font-bold bg-indigo-50 text-indigo-700 border border-indigo-200 my-2 font-gujarati';
          guj.innerText = line;
          container.appendChild(guj);
        } else if (line.trim() === 'English' || line.trim() === 'English:') {
          const eng = document.createElement('div');
          eng.className = 'inline-block px-3 py-1 rounded-full text-xs font-bold bg-sky-50 text-sky-700 border border-sky-200 my-2';
          eng.innerText = line;
          container.appendChild(eng);
        } else if (line.startsWith('Example:') || line.startsWith('ઉદાહરણ:') || line.startsWith('યાદ રાખો:') || line.startsWith('RBI →') || line.startsWith('Government of India →')) {
          const ex = document.createElement('div');
          ex.className = 'p-4 rounded-xl bg-amber-50/80 border border-amber-200 font-medium text-xs sm:text-sm text-amber-900 my-3 leading-relaxed';
          ex.innerText = line;
          container.appendChild(ex);
        } else if (line.trim().startsWith('⬇️') || line.trim().startsWith('↓')) {
          const arrow = document.createElement('div');
          arrow.className = 'text-center text-brand-600 font-bold text-lg my-1';
          arrow.innerText = '↓';
          container.appendChild(arrow);
        } else if (line.trim().length > 0) {
          const p = document.createElement('p');
          if (/[\u0A80-\u0AFF]/.test(line)) {
            p.className = 'font-gujarati text-slate-800 leading-relaxed';
          } else {
            p.className = 'text-slate-700 leading-relaxed';
          }
          p.innerText = line;
          container.appendChild(p);
        }
      });

      if (inTable && tableBuffer.length > 0) {
        container.appendChild(createTable(tableBuffer));
      }

      body.appendChild(container);
    }

    // Convert Markdown/Text table to HTML table
    function createTable(lines) {
      const wrap = document.createElement('div');
      wrap.className = 'overflow-x-auto my-5 rounded-xl border border-slate-200 shadow-sm';
      const tbl = document.createElement('table');
      tbl.className = 'legal-table';

      let isHead = true;
      lines.forEach(l => {
        const trm = l.trim();
        if (!trm || trm.startsWith('---') || trm.includes('---|---')) return;
        const cells = trm.split(/\||\t/).map(c => c.trim()).filter((c, idx, arr) => {
          if ((idx === 0 || idx === arr.length - 1) && c === '') return false;
          return true;
        });
        if (!cells.length) return;

        const row = document.createElement('tr');
        cells.forEach(c => {
          const el = isHead ? document.createElement('th') : document.createElement('td');
          el.innerText = c;
          row.appendChild(el);
        });
        tbl.appendChild(row);
        isHead = false;
      });

      wrap.appendChild(tbl);
      return wrap;
    }

    // Copy Topic Content to Clipboard
    function copyPageText() {
      const topic = TOPICS_DATA[currentTopicIndex];
      navigator.clipboard.writeText(topic.content).then(() => {
        showToast('Full topic text copied to clipboard!');
      }).catch(() => {
        showToast('Failed to copy text.');
      });
    }

    // Toast Popup
    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-text').innerText = msg;
      toast.classList.remove('hidden');
      setTimeout(() => {
        toast.classList.add('hidden');
      }, 2000);
    }

    // Keyboard Shortcuts (Esc to Home, Arrow keys to navigate)
    document.addEventListener('keydown', (e) => {
      const onTopicPage = !document.getElementById('topic-view').classList.contains('hidden');
      if (e.key === 'Escape' && onTopicPage) {
        goHome();
      } else if (e.key === 'ArrowRight' && onTopicPage) {
        navigateTopic(1);
      } else if (e.key === 'ArrowLeft' && onTopicPage) {
        navigateTopic(-1);
      }
    });

    // Scroll to Top Button Visibility
    window.addEventListener('scroll', () => {
      const btn = document.getElementById('scroll-top-btn');
      if (window.scrollY > 300) {
        btn.classList.remove('hidden');
      } else {
        btn.classList.add('hidden');
      }
    });

    // Router Listeners
    window.addEventListener('hashchange', handleRoute);
    window.addEventListener('DOMContentLoaded', () => {
      renderHomeGrid();
      handleRoute();
    });
  </script>
</body>

</html>
